name: Check Atlas source and build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - name: Validate article and knowledge graph references
        run: python scripts/validate_content.py
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Build offline site
        run: python build.py
      - name: Smoke test generated site
        run: python scripts/smoke_test.py
      - name: Test client-side view rendering
        run: node scripts/test_runtime.js
      - name: Test content growth and heading migrations
        run: python scripts/test_content.py
      - name: Test DOM interactions and keyboard navigation
        run: node --test scripts/test_interactions.js
