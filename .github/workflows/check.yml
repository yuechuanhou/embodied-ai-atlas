name: Check Atlas source and build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate article and knowledge graph references
        run: python scripts/validate_content.py
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Build offline site
        run: python build.py
        env:
          ATLAS_AGENT_ORIGIN: ${{ vars.ATLAS_AGENT_ORIGIN }}
      - name: Smoke test generated site
        run: python scripts/smoke_test.py
      - name: Test client-side view rendering
        run: node scripts/test_runtime.js
      - name: Test content growth and heading migrations
        run: python scripts/test_content.py
      - name: Test DOM interactions and keyboard navigation
        run: node --test scripts/test_interactions.js
      - name: Test Agent proposal and private database contracts
        run: python scripts/test_agent.py
      - name: Test semantic knowledge-change boundaries
        run: python scripts/test_agent_changes.py
      - name: Test isolated private validation and redacted reports
        run: python scripts/test_private_validation.py
      - name: Test single-repository public change gates
        run: python scripts/test_publication.py
      - name: Build isolated Agent interaction preview
        run: python build.py --agent-demo
      - name: Check Agent preview syntax and interactions
        run: |
          node --check assets/agent-demo-engine.js
          node --check assets/agent-demo.js
          npm run test:agent
      - name: Save reviewable Agent preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-agent-interaction-preview
          path: .preview/agent-demo/
          include-hidden-files: true

  private-runtime:
    name: Validate private runtime from a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/validate-private-runtime

  orbit-publication:
    name: Validate Orbit knowledge change
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'orbit/content-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the canonical repository and main target
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'yuechuanhou/embodied-ai-atlas' && github.base_ref == 'main' }}
        run: test "$SAME_REPOSITORY" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch public commit without executing its code
        env:
          ATLAS_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=2 origin "$ATLAS_REVIEW_HEAD"
      - name: Validate exact public after-image with trusted base code
        env:
          ATLAS_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          ATLAS_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m agent.publication_gate
