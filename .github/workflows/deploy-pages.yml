name: Build and deploy Embodied AI Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build requirements
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate knowledge base
        run: python scripts/validate_content.py
      - name: Check client JavaScript syntax
        run: node --check assets/site.js
      - name: Build static site
        run: python build.py
      - name: Smoke test generated site
        run: python scripts/smoke_test.py
      - name: Test client view rendering
        run: node scripts/test_runtime.js
      - name: Test content growth and heading migrations
        run: python scripts/test_content.py
      - name: Test DOM interactions and keyboard navigation
        run: node --test scripts/test_interactions.js
      - name: Test Agent proposal and private database contracts
        run: python scripts/test_agent.py
      - name: Test semantic knowledge-change boundaries
        run: python scripts/test_agent_changes.py
      - name: Build isolated Agent interaction preview
        run: python build.py --agent-demo
      - name: Check Agent preview syntax and interactions
        run: |
          node --check assets/agent-demo-engine.js
          node --check assets/agent-demo.js
          npm run test:agent
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
