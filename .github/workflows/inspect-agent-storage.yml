name: Inspect private Atlas storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-agent-d1-bootstrap
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'yuechuanhou/embodied-ai-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: atlas-agent-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test storage inspection with synthetic responses and no credentials
        run: node --test agent/runtime/test/inspect-storage.test.js
      - name: Read metadata and verify existing storage without exporting private content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
        run: node agent/runtime/scripts/inspect-storage.js
