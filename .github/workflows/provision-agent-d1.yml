name: Provision private Atlas D1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or create and initialize a new Atlas database
        type: choice
        options: [plan, apply]
        default: plan
      confirmation:
        description: For apply, enter atlas-agent-private
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: atlas-agent-d1-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'yuechuanhou/embodied-ai-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: atlas-agent-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/runtime/package-lock.json
      - run: npm ci --ignore-scripts --prefix agent/runtime
      - name: Test bootstrap boundaries without credentials
        run: node --test agent/runtime/test/bootstrap.test.js
      - name: Plan or initialize the dedicated database
        env:
          ATLAS_BOOTSTRAP_MODE: ${{ inputs.mode }}
          ATLAS_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node agent/runtime/scripts/bootstrap-d1.js
