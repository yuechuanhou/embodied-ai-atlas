name: Stage closed Atlas Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or first-time creation with every entry point disabled
        type: choice
        options: [plan, stage]
        default: plan
      confirmation:
        description: For stage, enter atlas-agent-private
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: atlas-agent-worker-setup
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'yuechuanhou/embodied-ai-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: atlas-agent-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/runtime/package-lock.json
      - run: npm ci --ignore-scripts --prefix agent/runtime
      - name: Build private Worker without credentials
        run: npm run build:stage --prefix agent/runtime
      - name: Test private runtime and deployment boundaries without credentials
        run: npm test --prefix agent/runtime
      - name: Plan or create the closed Worker
        env:
          ATLAS_WORKER_MODE: ${{ inputs.mode }}
          ATLAS_WORKER_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node agent/runtime/scripts/stage-worker.js
