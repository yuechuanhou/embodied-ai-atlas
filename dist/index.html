<script id="atlas-data" type="application/json">{"site":{"name":"Embodied AI Atlas","subtitle":"具身智能知识图谱 · Personal Learning Studio","version":"0.1.0","asOf":"2026-11-19"},"sections":[{"id":"start","name":"知识总览","eyebrow":"START HERE"},{"id":"data","name":"数据与数据工程","eyebrow":"DATA ENGINE"},{"id":"models","name":"模型与训练","eyebrow":"MODEL & LEARNING"},{"id":"evaluation","name":"评估与闭环","eyebrow":"EVALUATION"},{"id":"industry","name":"公司与 Data Recipe","eyebrow":"INDUSTRY INTELLIGENCE"},{"id":"foundations","name":"机器人技术基础","eyebrow":"ROBOTICS FOUNDATIONS"},{"id":"reference","name":"知识连接与资源","eyebrow":"REFERENCE"}],"pages":[{"id":"overview","section":"start","title":"从训练数据理解 Embodied AI","file":"overview.md","summary":"从能力需求、系统层级到数据闭环，建立整个领域的心智模型。","tags":["全景","Embodied AI","VLA"],"related":["data-taxonomy","data-recipe","data-flywheel"],"maturity":"核心导读","html":"<blockquote>\n<p><strong>核心问题：机器人到底需要从数据中学会什么？<\/strong> 它不只需要识别和理解世界，还需要采取动作，并通过真实交互持续改进。<\/p>\n<\/blockquote>\n<p>这篇是整个知识库的 <strong>起点（不是固定学习顺序）<\/strong>。你可以从任何感兴趣的分支进入，并通过文章之间的链接回到更完整的技术闭环。<\/p>\n<h2 id=\"section-1\">从一个真实任务出发<\/h2>\n<p>假设机器人收到指令：<strong>“Go to the kitchen, pick up a cup, and place it on the table.”<\/strong> 它需要的不只是语言理解。<\/p>\n<table>\n<thead>\n<tr>\n  <th>能力层<\/th>\n  <th>它要解决的问题<\/th>\n  <th>典型技术<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Perception 感知<\/td>\n  <td>杯子在哪里？什么是桌子？<\/td>\n  <td>Detection、Tracking、Depth、Pose<\/td>\n<\/tr>\n<tr>\n  <td>Understanding &amp; Planning 理解与规划<\/td>\n  <td>先移动还是先抓取？顺序如何安排？<\/td>\n  <td>VLM、Task Planning、Reasoning<\/td>\n<\/tr>\n<tr>\n  <td>Manipulation &amp; Control 操作与控制<\/td>\n  <td>机械臂怎么动？夹爪什么时候闭合？<\/td>\n  <td>VLA、Policy、IK、Control<\/td>\n<\/tr>\n<tr>\n  <td>Adaptation &amp; Recovery 适应与恢复<\/td>\n  <td>抓取失败、遮挡、碰撞如何处理？<\/td>\n  <td>Feedback、RL、Intervention<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这些能力从不同数据中学习。因此，同一家机器人公司可能同时需要人类视频、遥操、仿真、失败轨迹和数据标注。<\/p>\n<h2 id=\"section-2\">从硬件到模型的知识闭环<\/h2>\n<pre><code class=\"language-text\">Physical World\n      ↓\nRobot Sensors &amp; Actuators\n(Camera / IMU / Joint Encoder / Gripper)\n      ↓\nMultimodal Data Collection\n      ↓\nData Processing &amp; Annotation\n      ↓\nDataset / Data Recipe\n      ↓\nPretraining + Fine-tuning + RL\n      ↓\nRobot Policy / VLA / World Model\n      ↓\nDeployment &amp; Evaluation\n      ↓\nFailure / Correction / New Scenarios\n      └──────────→ Data Collection (Flywheel)\n<\/code><\/pre>\n<p>其中 <strong>Data Flywheel<\/strong> 不是“采集越来越多文件”这么简单，而是必须有一条 <strong>数据改善模型 → 模型创造新经验 → 新经验反过来改善模型<\/strong> 的可验证路径。<\/p>\n<h2 id=\"section-3\">一个 VLA 模型在学什么<\/h2>\n<p>简化的策略模型可以写成：<\/p>\n<pre><code class=\"language-text\">πθ(a_t | o_t, l)\n\no_t = observation（图像、机器人状态、历史信息等）\nl   = language instruction（任务指令）\na_t = action（关节命令、末端位姿变化或动作序列）\n<\/code><\/pre>\n<p>也就是说：<strong>根据现在看到的环境和任务目标，预测应该怎么行动。<\/strong> 但如果我们只有普通视频、没有动作记录，就不能直接使用相同的有监督动作损失。因此必须区分：<a href=\"?page=data-taxonomy\">行为示范<\/a>、<a href=\"?page=learning-paradigms\">世界模型<\/a>、<a href=\"?page=learning-paradigms\">动作推断<\/a>和<a href=\"?page=data-comparison\">仿真交互<\/a>等不同训练途径。<\/p>\n<h2 id=\"section-4\">六个相互联系的主题<\/h2>\n<ol>\n<li><strong>机器人与感知基础<\/strong>：Camera、IMU、Encoder、Coordinate Frame、URDF、TF、FK/IK、VIO、SLAM。<\/li>\n<li><strong>数据来源与处理<\/strong>：Real-World、Teleop、Human Video、UMI、Simulation、Synthetic；同步、标注、数据格式。<\/li>\n<li><strong>模型架构与训练<\/strong>：BC、IL、RL、Diffusion、Flow Matching、VLA、World Model、IDM。<\/li>\n<li><strong>评估与部署<\/strong>：成功率、泛化、鲁棒性、数据质量、干预和失败恢复。<\/li>\n<li><strong>公司与行业路线<\/strong>：GR00T、Physical Intelligence、Figure、1X、Gemini Robotics、TRI、AgiBot、Skild。<\/li>\n<li><strong>知识连接<\/strong>：术语、开源数据、论文、工程案例、不同研究方案的对比。<\/li>\n<\/ol>\n<h2 id=\"section-5\">不要混淆的几个概念<\/h2>\n<ul>\n<li><strong>Real-world data ≠ Teleoperation data<\/strong>：前者指真实环境，后者指操作者控制的采集方式；两者可以同时成立。<\/li>\n<li><strong>Human video ≠ Robot action data<\/strong>：人类视频通常不含可直接控制目标机器人的 joint action。<\/li>\n<li><strong>Data amount ≠ Training weight<\/strong>：公司持有的小时数，不等于训练 batch 中的数据权重。<\/li>\n<li><strong>Model benchmark ≠ Deployment reliability<\/strong>：不同公司的内部任务集与真实部署环境不一定可比较。<\/li>\n<li><strong>World Model ≠ Robot Policy<\/strong>：世界模型预测状态如何演化；控制策略选择动作，两者可能结合但并不等价。<\/li>\n<\/ul>\n<h2 id=\"section-6\">从哪里继续<\/h2>\n<p>根据你现在最关心的问题自由选择：<a href=\"?page=data-taxonomy\">数据分类<\/a> → <a href=\"?page=data-comparison\">横向比较<\/a> → <a href=\"?page=data-recipe\">Data Recipe<\/a> → <a href=\"?page=training-loop\">训练过程<\/a> → <a href=\"?page=industry-landscape\">行业案例<\/a>。也可以直接去看 <a href=\"?page=robotics-stack\">机器人技术基础<\/a> 或 <a href=\"?page=glossary\">术语速查<\/a>。<\/p>\n","toc":[{"level":2,"title":"从一个真实任务出发","id":"section-1"},{"level":2,"title":"从硬件到模型的知识闭环","id":"section-2"},{"level":2,"title":"一个 VLA 模型在学什么","id":"section-3"},{"level":2,"title":"六个相互联系的主题","id":"section-4"},{"level":2,"title":"不要混淆的几个概念","id":"section-5"},{"level":2,"title":"从哪里继续","id":"section-6"}],"words":1833},{"id":"data-taxonomy","section":"data","title":"数据来源与分类体系","file":"data-taxonomy.md","summary":"真实机器人、遥操、自主 rollout、人类视频、UMI、仿真及生成式数据。","tags":["Data","Teleoperation","UMI","Simulation"],"related":["data-comparison","data-pipeline","learning-paradigms"],"maturity":"已整理","html":"<blockquote>\n<p><strong>分类的关键<\/strong>：采集环境、操作者和数据内容是三个不同维度。不要把“真实数据”“遥操数据”“视频数据”当成互斥选项。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">先按三个维度分类<\/h2>\n<table>\n<thead>\n<tr>\n  <th>维度<\/th>\n  <th>可能的取值<\/th>\n  <th>回答的问题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Environment 环境<\/td>\n  <td>Real World / Simulation / Generated<\/td>\n  <td>数据在哪里产生？<\/td>\n<\/tr>\n<tr>\n  <td>Actor / Collection Method 产生方式<\/td>\n  <td>Human / Teleoperator / Autonomous Robot<\/td>\n  <td>谁在执行动作？<\/td>\n<\/tr>\n<tr>\n  <td>Supervision / Modality 数据内容<\/td>\n  <td>Video / Robot State / Action / Language / Reward<\/td>\n  <td>具体记录了什么？<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>比如通过 VR 控制真实机器人完成抓取，得到的数据同时是 <strong>Real-World + Teleoperation + Multimodal Action-Labeled<\/strong>。<\/p>\n<h2 id=\"section-2\">1. Robot Teleoperation Data — 真实机器人遥操<\/h2>\n<p>人类通过 leader-follower 机械臂、手柄、VR、动捕设备或其他接口，控制真实机器人执行任务。记录包括 camera frames、joint states、end-effector pose、gripper command、timestamps 和 task metadata。<\/p>\n<p><strong>主要作用<\/strong>：Behavior Cloning / Imitation Learning；直接提供目标平台可执行的 <code>(observation, action)<\/code> 配对。<\/p>\n<p><strong>优点<\/strong>：动作标签原生可用、物理真实性高、与目标 hardware 接近。<strong>局限<\/strong>：昂贵、操作员能力差异大、动作分布可能偏向成功轨迹且覆盖有限。<\/p>\n<h2 id=\"section-3\">2. Autonomous Robot Rollout Data — 机器人自主运行<\/h2>\n<p>让当前 policy 在真实机器人上自行运行，采集完整 rollout、success/failure、干预和环境状态变化。<\/p>\n<p><strong>主要作用<\/strong>：定位真实失效模式、训练恢复策略、强化学习、离线强化学习、模型评估；它与遥操示范形成 complementary data。<\/p>\n<p><strong>优点<\/strong>：贴近模型真实部署分布，能产生模型自己“会犯的错误”。<strong>局限<\/strong>：早期 policy 可能大量失败，动作质量并非天然可靠；需要安全管理与可信奖励/反馈。<\/p>\n<h2 id=\"section-4\">3. Human Demonstration / Egocentric Video — 人类视频<\/h2>\n<p>通过手机、头戴相机、第一人称摄像头或公开视频，记录人类如何做饭、整理、装配和操作物体。<\/p>\n<p><strong>主要作用<\/strong>：学习视觉语义、任务结构、物体交互、动作意图和物理变化；适合大规模预训练和 World Model。<\/p>\n<p><strong>优点<\/strong>：多样性大、采集可扩展、无需机器人硬件。<strong>局限<\/strong>：通常没有机器人原生 action labels；人类手和机器人执行器不同，存在 <strong>Human-to-Robot Gap<\/strong>。<\/p>\n<h2 id=\"section-5\">4. UMI / Instrumented Human Data — 带动作测量的人类示范<\/h2>\n<p>UMI（Universal Manipulation Interface）典型地通过带视觉传感器的手持夹爪，让人执行操作并同时记录操作轨迹。动捕手套等方案也可记录人体动作。<\/p>\n<p><strong>主要作用<\/strong>：低于真实机器人遥操的硬件开销，获得更接近机器人 action space 的示范；适合跨形态迁移或目标平台微调。<\/p>\n<p><strong>局限<\/strong>：轨迹仍需重定向（retargeting）；不同夹爪、手指自由度、力反馈和接触动力学不可直接等价。<\/p>\n<h2 id=\"section-6\">5. Simulation Data — 物理仿真<\/h2>\n<p>在 Isaac Sim、MuJoCo、Isaac Lab 等模拟环境里运行机器人、策略或人类遥操。可控制地形、光照、质量、摩擦、场景布局和物体分布，并输出精确模拟状态与动作。<\/p>\n<p><strong>主要作用<\/strong>：Domain Randomization、预训练、强化学习、稀有场景生成与回归验证。<\/p>\n<p><strong>优点<\/strong>：并行化好、边际采样成本低、失败更安全。<strong>局限<\/strong>：Sim-to-Real Gap，特别是摩擦、形变、接触、传感器噪声和执行延迟。<\/p>\n<h2 id=\"section-7\">6. Generative Synthetic Data — 生成式合成数据<\/h2>\n<p>利用视频生成模型、轨迹生成方法或 World Model，生成新的未来观察、环境或动作候选。这类数据不一定来自显式物理引擎。<\/p>\n<p><strong>主要作用<\/strong>：扩大视觉变化与任务组合、学习可能的未来世界状态、辅助数据增广。<\/p>\n<p><strong>局限<\/strong>：生成视频看起来合理，不代表对应机器人动作一定可执行；错误物理规律可能产生误导性监督。<\/p>\n<h2 id=\"section-8\">一个重要的补充：失败数据也可能非常有价值<\/h2>\n<p><code>失败<\/code> 不是一种必须被删除的数据类别。失败轨迹、人工干预和最终结果，若有可靠标签，可以用于 failure prediction、recovery policy、reward learning、offline RL 和 policy improvement。<\/p>\n<p>但不要把没有质量标记的失败动作直接等同于专家示范，否则可能教模型模仿错误动作。<\/p>\n<p>进一步看：<a href=\"?page=data-comparison\">横向对比<\/a> / <a href=\"?page=data-pipeline\">数据到训练的处理链<\/a> / <a href=\"?page=learning-paradigms\">IL、RL 与世界模型<\/a>。<\/p>\n","toc":[{"level":2,"title":"先按三个维度分类","id":"section-1"},{"level":2,"title":"1. Robot Teleoperation Data — 真实机器人遥操","id":"section-2"},{"level":2,"title":"2. Autonomous Robot Rollout Data — 机器人自主运行","id":"section-3"},{"level":2,"title":"3. Human Demonstration / Egocentric Video — 人类视频","id":"section-4"},{"level":2,"title":"4. UMI / Instrumented Human Data — 带动作测量的人类示范","id":"section-5"},{"level":2,"title":"5. Simulation Data — 物理仿真","id":"section-6"},{"level":2,"title":"6. Generative Synthetic Data — 生成式合成数据","id":"section-7"},{"level":2,"title":"一个重要的补充：失败数据也可能非常有价值","id":"section-8"}],"words":1923},{"id":"data-comparison","section":"data","title":"数据横向比较与训练价值","file":"data-comparison.md","summary":"从动作标签、成本、规模、多样性和泛化价值评估数据。","tags":["Data","Trade-offs","Quality"],"related":["data-taxonomy","data-recipe","quality-evaluation"],"maturity":"已整理","html":"<blockquote>\n<p><strong>不是哪一种数据“最好”，而是“哪一种数据最适合当前要训练的能力”。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">横向对比<\/h2>\n<p>下面是典型工程条件下的定性判断，不代表所有公司、硬件或任务必然适用。<\/p>\n<table>\n<thead>\n<tr>\n  <th>数据来源<\/th>\n  <th>机器人原生 Action<\/th>\n  <th>单位数据成本<\/th>\n  <th>可扩展性<\/th>\n  <th>典型瓶颈<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>真实机器人遥操<\/td>\n  <td>是<\/td>\n  <td>高<\/td>\n  <td>较弱<\/td>\n  <td>操作员、硬件和环境<\/td>\n<\/tr>\n<tr>\n  <td>自主机器人 Rollout<\/td>\n  <td>是<\/td>\n  <td>中至高<\/td>\n  <td>中<\/td>\n  <td>当前策略性能、安全性<\/td>\n<\/tr>\n<tr>\n  <td>普通人类视频<\/td>\n  <td>通常没有<\/td>\n  <td>低至中<\/td>\n  <td>很强<\/td>\n  <td>Action 缺失、形态差距<\/td>\n<\/tr>\n<tr>\n  <td>UMI / 动捕示范<\/td>\n  <td>可转换<\/td>\n  <td>中<\/td>\n  <td>较强<\/td>\n  <td>Retargeting、传感器精度<\/td>\n<\/tr>\n<tr>\n  <td>物理仿真<\/td>\n  <td>是<\/td>\n  <td>初期成本高、边际成本低<\/td>\n  <td>很强<\/td>\n  <td>Sim-to-Real Gap<\/td>\n<\/tr>\n<tr>\n  <td>生成式合成数据<\/td>\n  <td>视方法而定<\/td>\n  <td>可较低<\/td>\n  <td>很强<\/td>\n  <td>真实性、动作可执行性<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-2\">不同训练目标对应什么数据？<\/h2>\n<table>\n<thead>\n<tr>\n  <th>训练目标<\/th>\n  <th>优先考虑的数据<\/th>\n  <th>原因<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>视觉语义和任务知识<\/td>\n  <td>Web / Ego Human Video<\/td>\n  <td>覆盖更多物体、环境、操作过程<\/td>\n<\/tr>\n<tr>\n  <td>目标机器人稳定模仿<\/td>\n  <td>Teleoperation / Robot Demonstration<\/td>\n  <td>真实的 observation–action 配对<\/td>\n<\/tr>\n<tr>\n  <td>跨机器人通用操作<\/td>\n  <td>Multi-Robot + UMI + Robot Data<\/td>\n  <td>多 embodiment 共性和适配能力<\/td>\n<\/tr>\n<tr>\n  <td>运动技能与接触策略<\/td>\n  <td>Real-Robot + Simulation<\/td>\n  <td>需要动作、状态和动力学信息<\/td>\n<\/tr>\n<tr>\n  <td>失败恢复和安全行为<\/td>\n  <td>On-policy Rollout + Intervention<\/td>\n  <td>直接覆盖部署时失效分布<\/td>\n<\/tr>\n<tr>\n  <td>世界动态预测<\/td>\n  <td>Video + Action-conditioned Interaction<\/td>\n  <td>学习状态随时间和动作变化的规律<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-3\">为什么百万小时视频不能直接替代遥操？<\/h2>\n<p>普通视频可能显示某个人抓起杯子，但未记录机器人具体应执行的 <code>q1...q6<\/code> 或末端运动指令。人类身体和机器人形态不同，机器人想复现操作，还需推断动作、跨形态映射或通过目标机器人数据适配。<\/p>\n<p>换句话说：<strong>Human Video 擅长教“发生了什么以及为什么”，Robot Demonstration 更直接教“具体应该输出什么控制动作”。<\/strong> 但这只是典型分工，World-Action 联合训练正在模糊两者之间的界线。<\/p>\n<h2 id=\"section-4\">为什么仿真不能完全替代真实数据？<\/h2>\n<p>一个仿真中成功率 99% 的抓取策略，可能遇到真实世界的物体形变、光照、机械间隙、夹爪摩擦和未知干扰而显著掉点。<strong>仿真扩大覆盖，真实数据校准现实。<\/strong><\/p>\n<h2 id=\"section-5\">自主数据和专家示范为何互补？<\/h2>\n<pre><code class=\"language-text\">Human Demonstrations\n     ↓\nBehavior Cloning → Policy v1\n     ↓\nAutonomous Robot Execution\n     ↓\nFailures / Rewards / Human Corrections\n     ↓\nPolicy Improvement → Policy v2\n<\/code><\/pre>\n<p>纯专家数据一般不充分覆盖模型走偏后会进入的状态。自主数据可用于学习恢复和纠偏，但需要区分好动作、坏动作及结果，而不是无差别模仿。<\/p>\n<h2 id=\"section-6\">真正该比较的不是文件大小<\/h2>\n<p>对于训练价值，通常还需要看：<\/p>\n<ul>\n<li><strong>Action coverage<\/strong>：关节、末端位姿、夹爪、力控等动作空间是否匹配目标机器人？<\/li>\n<li><strong>Diversity<\/strong>：任务、物体、初始条件、环境、机器人类型是否多样？<\/li>\n<li><strong>Temporal integrity<\/strong>：Camera、IMU、Action 等是否同步？<\/li>\n<li><strong>Annotation &amp; Feedback<\/strong>：成功、失败、错误类型和干预是否可信？<\/li>\n<li><strong>Model utility<\/strong>：引入这类数据后，未见任务和真实部署性能有无提升？<\/li>\n<\/ul>\n<p>下一步：<a href=\"?page=data-recipe\">Data Recipe 如何分配训练阶段和混合权重<\/a>。<\/p>\n","toc":[{"level":2,"title":"横向对比","id":"section-1"},{"level":2,"title":"不同训练目标对应什么数据？","id":"section-2"},{"level":2,"title":"为什么百万小时视频不能直接替代遥操？","id":"section-3"},{"level":2,"title":"为什么仿真不能完全替代真实数据？","id":"section-4"},{"level":2,"title":"自主数据和专家示范为何互补？","id":"section-5"},{"level":2,"title":"真正该比较的不是文件大小","id":"section-6"}],"words":1353},{"id":"data-pipeline","section":"data","title":"采集、处理与 Dataset Schema","file":"data-pipeline.md","summary":"Episode、观测与动作、时间同步、MCAP、Parquet、视频与 LeRobot。","tags":["Dataset","MCAP","Schema","Episode"],"related":["robotics-stack","data-recipe","quality-evaluation"],"maturity":"已整理","html":"<blockquote>\n<p>一段机器人动作最终变成模型能读取的 <code>(observation, action)<\/code> 样本，中间要经历的步骤往往比预想多得多。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Step 1：采集一段 Episode<\/h2>\n<p>假设人类遥操机械臂完成 <code>Pick up the cup and place it in the tray<\/code>。一个 episode 可能含有：<\/p>\n<pre><code class=\"language-text\">episode_001/\n  RGB / Depth / Wrist Cameras\n  Joint positions, velocities\n  End-effector pose / gripper state\n  Robot actions / control commands\n  Timestamps / clock source\n  Task instruction / outcome\n  Camera calibration / robot config\n<\/code><\/pre>\n<p><strong>Episode<\/strong> 通常是一段以某个任务为单位组织的交互轨迹。它不一定只包含成功数据，也不一定有统一时长。<\/p>\n<h2 id=\"section-2\">Step 2：Decode → Synchronize → Calibrate → Align<\/h2>\n<pre><code class=\"language-text\">Raw Data (MCAP / ROS bag / device log)\n    ↓ Decode\nVideo / IMU / Robot State / Action\n    ↓ Timestamp Synchronization\nUnified temporal reference\n    ↓ Calibration + Coordinate Transform\nComparable frames and units\n    ↓ Action–Observation Alignment\n(o_t, a_t) or (o_t, a_t...a_{t+H})\n    ↓ Segmentation / Annotation / Filtering\nTraining-ready dataset\n<\/code><\/pre>\n<p>一个具体问题：Camera 是 30Hz、Joint State 是 100Hz、IMU 是 200Hz。不能简单按“第 n 个数据对应第 n 个图像”匹配；应当使用定义明确的时间戳与采样/插值策略。<\/p>\n<h2 id=\"section-3\">Step 3：建立 Schema<\/h2>\n<p>典型训练样本：<\/p>\n<pre><code class=\"language-json\">{\n  &quot;timestamp&quot;: 12.53,\n  &quot;observation&quot;: {\n    &quot;image_front&quot;: &quot;video frame reference&quot;,\n    &quot;joint_positions&quot;: [0.12, -0.34, 0.9],\n    &quot;gripper_opening&quot;: 0.04\n  },\n  &quot;action&quot;: {\n    &quot;ee_delta_pose&quot;: [0.02, 0, 0, 0, 0, 0],\n    &quot;gripper_command&quot;: &quot;close&quot;\n  },\n  &quot;instruction&quot;: &quot;pick up the cup&quot;,\n  &quot;outcome&quot;: &quot;success&quot;\n}\n<\/code><\/pre>\n<p>这是<strong>示意 Schema<\/strong>，并非某家数据集的真实字段定义。数据工程最需要核实的是：动作是 joint target、delta pose、torque 还是 velocity？使用哪个 frame？时间戳代表采样时间还是发布/到达时间？<\/p>\n<h2 id=\"section-4\">常见存储格式<\/h2>\n<table>\n<thead>\n<tr>\n  <th>格式<\/th>\n  <th>典型用途<\/th>\n  <th>注意点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>.mcap<\/code><\/td>\n  <td>多 topic 时间序列日志<\/td>\n  <td>容器可同时保存 raw 和 processed data<\/td>\n<\/tr>\n<tr>\n  <td><code>.mp4<\/code> / <code>.jpg<\/code> / <code>.png<\/code><\/td>\n  <td>视频/帧<\/td>\n  <td>编码方式、fps、关键帧、色彩格式<\/td>\n<\/tr>\n<tr>\n  <td><code>.parquet<\/code><\/td>\n  <td>结构化 Robot State / Action / Meta<\/td>\n  <td>列式压缩、适合大数据读取<\/td>\n<\/tr>\n<tr>\n  <td><code>.hdf5<\/code><\/td>\n  <td>多模态数组和 Episode<\/td>\n  <td>结构灵活、生态兼容依赖 Schema<\/td>\n<\/tr>\n<tr>\n  <td><code>.json<\/code> / <code>.jsonl<\/code><\/td>\n  <td>Annotation、Task、Metadata<\/td>\n  <td>可读，但大规模数值序列不一定高效<\/td>\n<\/tr>\n<tr>\n  <td><code>.npy<\/code> / <code>.npz<\/code><\/td>\n  <td>数值数组、tensor<\/td>\n  <td>简单直接，需额外元数据约定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>一种常见组合是 <code>MP4 + Parquet + JSON metadata<\/code>；HDF5 则可能将多种模态组织在单一容器中。<\/p>\n<p><strong>注意：LeRobotDataset v3.0<\/strong> 使用 Parquet 与 MP4 分片及 metadata 索引，一个文件可包含多个 episode；不是每个 episode 必须拥有独立 MP4。参见 <a href=\"https://huggingface.co/docs/lerobot/lerobot-dataset-v3\">Hugging Face 官方说明<\/a>。<\/p>\n<h2 id=\"section-5\">三个常见工程失误<\/h2>\n<ol>\n<li><strong>Timestamp mismatch<\/strong>：传感器时间基不统一，动作和帧错位。<\/li>\n<li><strong>Coordinate mismatch<\/strong>：Camera Frame、Base Frame、World Frame 混用，导致物体位置与动作不一致。<\/li>\n<li><strong>Action semantic mismatch<\/strong>：把 commanded action 当作 measured state，把 position target 当作 velocity。<\/li>\n<\/ol>\n<p>这些问题会导致模型学习到错误对应关系，即使每个文件“看起来都能播放”。<\/p>\n<h2 id=\"section-6\">接回机器人基础知识<\/h2>\n<p><a href=\"?page=sensors-and-estimation\">Camera / IMU / Encoder<\/a> → <a href=\"?page=geometry-and-frames\">URDF / TF / Coordinate<\/a> → <a href=\"?page=file-formats\">MCAP / 软件格式<\/a> → Data Processing → <a href=\"?page=training-loop\">Model Training<\/a>。<\/p>\n","toc":[{"level":2,"title":"Step 1：采集一段 Episode","id":"section-1"},{"level":2,"title":"Step 2：Decode → Synchronize → Calibrate → Align","id":"section-2"},{"level":2,"title":"Step 3：建立 Schema","id":"section-3"},{"level":2,"title":"常见存储格式","id":"section-4"},{"level":2,"title":"三个常见工程失误","id":"section-5"},{"level":2,"title":"接回机器人基础知识","id":"section-6"}],"words":2025},{"id":"data-recipe","section":"data","title":"Data Recipe：数据怎么配","file":"data-recipe.md","summary":"阶段、混合比例、采样、目标函数与模型能力的对应关系。","tags":["Data Recipe","Pretraining","Post-training"],"related":["training-loop","industry-landscape","data-flywheel"],"maturity":"核心专题","html":"<blockquote>\n<p><strong>Data Recipe = 数据来源 + 数据处理 + 训练阶段 + 采样策略 + 学习目标。<\/strong> 它不是把几种数据的小时数列出来就结束。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">为什么需要 Recipe？<\/h2>\n<p>不同数据拥有的监督信号不同：机器人遥操有目标平台 action；人类视频一般只有视觉变化；仿真可能有精确状态和奖励；自主 rollout 可以有失败、成功和干预。<\/p>\n<p>要让同一个模型有效利用这些数据，需要决定 <strong>什么时候用、以什么比例用、为了学到什么能力而用<\/strong>。<\/p>\n<h2 id=\"section-2\">一个可理解的三阶段结构<\/h2>\n<table>\n<thead>\n<tr>\n  <th>阶段<\/th>\n  <th>常见数据<\/th>\n  <th>学习目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Broad Pretraining<\/td>\n  <td>Web Video、Ego Video、多机器人数据、Simulation<\/td>\n  <td>视觉、语义、任务/物理先验、通用动作表示<\/td>\n<\/tr>\n<tr>\n  <td>Post-training / Fine-tuning<\/td>\n  <td>Target Robot Teleoperation、Task Demonstrations<\/td>\n  <td>对齐目标 robot embodiment 和关键任务<\/td>\n<\/tr>\n<tr>\n  <td>Experience-based Improvement<\/td>\n  <td>Autonomous Rollouts、Failure、Correction、Reward<\/td>\n  <td>提高真实任务成功率、速度和鲁棒性<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>注意<\/strong>：这是一种教学性整合，不是行业唯一架构。具体模型可能联合训练不同来源、交替训练或使用更复杂的多目标损失。<\/p>\n<h2 id=\"section-3\">数据总量不是 Training Sampling Ratio<\/h2>\n<p>假设平台有：<\/p>\n<pre><code class=\"language-text\">100,000 h Human Video\n  5,000 h Robot Teleoperation\n<\/code><\/pre>\n<p>不能得出“训练中一定按 20:1 使用”这个结论。Training Mixer 可能大量 oversample 高价值机器人 action，给不同数据设 loss weight，或者先用人类视频做 world pretraining，再单独 fine-tune robot policy。<\/p>\n<p>正确的问题是：<\/p>\n<ul>\n<li>各数据池的<strong>总量、去重后的有效量<\/strong>分别是多少？<\/li>\n<li>每个 training step 的<strong>抽样比例、训练 token 数、loss 权重<\/strong>是多少？<\/li>\n<li>各数据对应什么 <strong>objective<\/strong>？视频预测、动作预测、奖励估计，还是多目标联合训练？<\/li>\n<li>各训练阶段切换时，什么参数被冻结、什么参数被更新？<\/li>\n<li>训练结果在同一套 held-out tasks 上有无明确 <strong>ablation<\/strong> 支持？<\/li>\n<\/ul>\n<h2 id=\"section-4\">Data Recipe 不只是“训练阶段”<\/h2>\n<p>一份完整的研究记录还应描述：<\/p>\n<ol>\n<li><strong>Data provenance<\/strong>：来源、许可、采集设备、版本与可追溯性。<\/li>\n<li><strong>Filtering<\/strong>：质量筛选、去重、失败与成功的处理方式。<\/li>\n<li><strong>Normalization<\/strong>：坐标系、单位、动作表示、时间间隔统一。<\/li>\n<li><strong>Mixture<\/strong>：数据权重、任务分布、不同机器人权重。<\/li>\n<li><strong>Objective<\/strong>：BC、Flow Matching、Video Prediction、RL 等。<\/li>\n<li><strong>Evaluation<\/strong>：任务范围、环境变化、硬件差异、真实部署表现。<\/li>\n<\/ol>\n<h2 id=\"section-5\">跨公司的公开数字如何读？<\/h2>\n<p>例如 <a href=\"?page=company-nvidia\">NVIDIA GR00T 2<\/a> 公布了人类视频、UMI 与机器人遥操各自的小时数；<a href=\"?page=company-toyota\">Toyota LBM<\/a> 也披露了较精确的数据池。但并不是所有公司都公开了完整 batch 混合权重、训练 token 分布与去重策略。<\/p>\n<p>因此，不应从三个数据量数字直接推算模型每一步梯度中人类视频和机器人数据的“贡献比例”。<\/p>\n<h2 id=\"section-6\">一个成熟的判断框架<\/h2>\n<p><strong>数据对某项能力的边际贡献<\/strong>，比“总数据量”更有价值。可通过 controlled ablation 来观察：删掉人类视频是否明显降低新环境泛化？删掉 failure rollouts 是否让恢复能力下降？增加某个机器人平台的数据是否帮助其他平台？<\/p>\n<p>下一步探索：<a href=\"?page=training-loop\">模型如何从示范学习动作<\/a> / <a href=\"?page=industry-landscape\">行业 Data Recipe<\/a> / <a href=\"?page=quality-evaluation\">如何评价数据质量<\/a>。<\/p>\n","toc":[{"level":2,"title":"为什么需要 Recipe？","id":"section-1"},{"level":2,"title":"一个可理解的三阶段结构","id":"section-2"},{"level":2,"title":"数据总量不是 Training Sampling Ratio","id":"section-3"},{"level":2,"title":"Data Recipe 不只是“训练阶段”","id":"section-4"},{"level":2,"title":"跨公司的公开数字如何读？","id":"section-5"},{"level":2,"title":"一个成熟的判断框架","id":"section-6"}],"words":1442},{"id":"training-loop","section":"models","title":"从一条示范到一次模型训练","file":"training-loop.md","summary":"从遥操 episode 到 BC loss、action chunk 和模型更新。","tags":["Behavior Cloning","Action","Training"],"related":["learning-paradigms","model-architecture","data-pipeline"],"maturity":"已整理","html":"<blockquote>\n<p><strong>从采集一个 episode 到训练一个机器人模型，本质是把“看到什么 → 应该执行什么动作”转成可优化的训练目标。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">1. 一段 Pick &amp; Place 演示<\/h2>\n<p>操作员遥控机器人把杯子放进托盘，记录任务指令、相机画面、关节/夹爪状态、动作和时间戳：<\/p>\n<pre><code class=\"language-text\">Task: Pick up the cup and place it in the tray\n\nObservation:\n  RGB / Depth\n  Robot joints / gripper state\n  End-effector pose\n\nAction:\n  Joint target / EE delta pose / gripper command\n\nMetadata:\n  Timestamp / calibration / success flag\n<\/code><\/pre>\n<p>原始日志经过 <a href=\"?page=data-pipeline\">数据处理与 Schema<\/a>，得到成对的 observation 和 action。<\/p>\n<h2 id=\"section-2\">2. Behavior Cloning（BC）<\/h2>\n<p>训练数据写成：<\/p>\n<pre><code class=\"language-text\">D = {(o_t, a_t)} for t = 1,...,N\n<\/code><\/pre>\n<p>模型预测动作：<\/p>\n<pre><code class=\"language-text\">â_t = πθ(o_t, language_instruction)\n<\/code><\/pre>\n<p>比如专家让夹爪沿 X 正向移动 2cm，模型预测 1.5cm，就根据误差更新参数。一个最简单的连续回归目标是：<\/p>\n<pre><code class=\"language-text\">L_BC = (1/N) × Σ_t ||πθ(o_t,l) - a_t||²\n<\/code><\/pre>\n<p>这只是帮助理解 BC 的简化公式。现代连续动作生成模型可能使用 <strong>Diffusion / Flow Matching<\/strong>，不直接对最终单一步动作计算 MSE。<\/p>\n<h2 id=\"section-3\">3. Action Chunking（动作块）<\/h2>\n<p>模型不一定只预测下一步动作，也可以一次预测未来 H 步：<\/p>\n<pre><code class=\"language-text\">A_t = [a_t, a_{t+1}, ..., a_{t+H-1}]\n<\/code><\/pre>\n<p>执行方案可能是：<\/p>\n<pre><code class=\"language-text\">Current Observation\n       ↓\nVLA → Predict Future Action Chunk\n       ↓\nExecute First Several Actions\n       ↓\nRead New Observation\n       ↓\nReplan\n<\/code><\/pre>\n<p>这与滚动控制（receding horizon）的思路相似。Chunk 太短可能使推理开销大；Chunk 太长则可能对新出现的遮挡、碰撞、物体滑动反应较慢。<\/p>\n<h2 id=\"section-4\">4. 机器人可以“直接用视频学习动作”吗？<\/h2>\n<p>如果是普通人类视频，通常<strong>不能直接套用上面的动作回归损失<\/strong>，因为没有机器人目标 action。可能的路线包括：<\/p>\n<ul>\n<li>Video Prediction：学习未来环境状态变化；<\/li>\n<li>Inverse Dynamics Model：由前后状态估计对应动作；<\/li>\n<li>Retargeting：把人类手/工具轨迹映射到机器人；<\/li>\n<li>Video-conditioned Policy：把视频示范作为上下文；<\/li>\n<li>Robot data fine-tuning：通过少量目标机器人数据做适配。<\/li>\n<\/ul>\n<h2 id=\"section-5\">5. Policy 训练之后还差什么？<\/h2>\n<p><strong>Policy 的动作输出不等于完整的机器人软件栈。<\/strong> 真实执行仍要经过动作解码、频率对齐、运动规划或低层控制、碰撞约束与安全检查。然后才能运行真实机器人、获取 rollout 并形成 <a href=\"?page=data-flywheel\">反馈闭环<\/a>。<\/p>\n<h2 id=\"section-6\">和传统机器人控制有什么关系？<\/h2>\n<p>你前面学的 <a href=\"?page=geometry-and-frames\">IK / FK<\/a> 仍然有价值：某些 VLA 预测 end-effector delta pose，之后仍要通过 IK 或控制器将其转换为可执行关节目标；另一些模型直接输出关节命令。动作表示的不同，会影响训练数据 Schema 和 deployment pipeline。<\/p>\n","toc":[{"level":2,"title":"1. 一段 Pick & Place 演示","id":"section-1"},{"level":2,"title":"2. Behavior Cloning（BC）","id":"section-2"},{"level":2,"title":"3. Action Chunking（动作块）","id":"section-3"},{"level":2,"title":"4. 机器人可以“直接用视频学习动作”吗？","id":"section-4"},{"level":2,"title":"5. Policy 训练之后还差什么？","id":"section-5"},{"level":2,"title":"和传统机器人控制有什么关系？","id":"section-6"}],"words":1325},{"id":"learning-paradigms","section":"models","title":"IL、RL 与 World Model","file":"learning-paradigms.md","summary":"模仿学习、强化学习、世界模型以及 IDM 如何协同。","tags":["IL","RL","World Model","IDM"],"related":["training-loop","model-architecture","data-flywheel"],"maturity":"已整理","html":"<blockquote>\n<p><strong>IL 学“别人怎么做”；RL 学“做完会怎样”；World Model 学“世界将怎么变化”。<\/strong> 三者相关，但不是同一种算法。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Imitation Learning / Behavior Cloning<\/h2>\n<p>给模型专家示范，让它模仿专家选择动作。真实遥操数据最直接；UMI 和跨机器人数据需要解决 action representation / retargeting。<\/p>\n<p><strong>优势<\/strong>：有高质量专家动作时收敛直接、容易开始。<strong>问题<\/strong>：分布偏移（distribution shift）——模型一旦做错，可能进入专家示范没出现过的状态。<\/p>\n<h2 id=\"section-2\">Reinforcement Learning<\/h2>\n<p>机器人执行动作，环境返回下一状态以及奖励/反馈，模型据此优化策略。<\/p>\n<pre><code class=\"language-text\">State → Policy → Action → Environment\n  ↑                       ↓\n  └──── Next State + Reward\n<\/code><\/pre>\n<p><strong>优势<\/strong>：可以通过试错改进真实任务表现，不局限于模仿。<strong>问题<\/strong>：真实机器人探索成本高且有安全风险；reward 设计和评估也不简单。<\/p>\n<p>实际研究中有 on-policy RL、offline RL、human intervention、reward modeling 等不同方法；失败数据不应一概当作专家动作。<\/p>\n<h2 id=\"section-3\">World Model<\/h2>\n<p>学习给定当前状态及可选动作后，世界如何演化。可以预测 future observations、latent states 或其它环境表征。<\/p>\n<pre><code class=\"language-text\">Current Observation + (Candidate Action)\n                 ↓\n             World Model\n                 ↓\n           Future State / Video\n<\/code><\/pre>\n<p>World Model 可以用于学习物理先验、产生候选未来、规划或训练策略，<strong>不等同于已经拥有机器人可执行的 Policy<\/strong>。<\/p>\n<h2 id=\"section-4\">Inverse Dynamics Model（IDM）<\/h2>\n<p>IDM 反过来回答：如果看到环境从 A 变到 B，机器人做了什么动作？<\/p>\n<pre><code class=\"language-text\">Frame A + Frame B → IDM → Possible Robot Actions\n<\/code><\/pre>\n<p>这可以帮助把视频学习到的状态变化与机器人 action space 对接。由于动作可能不唯一，IDM 的结果也并非天然完全正确。<\/p>\n<h2 id=\"section-5\">World-Action Model（WAM）<\/h2>\n<p>一些新模型同时学习 future visual states 与 robot actions，用共享模型连接世界变化预测和动作生成。<a href=\"?page=company-nvidia\">NVIDIA GR00T 2<\/a>、<a href=\"?page=company-agibot\">AgiBot GE-Act 2.0<\/a> 是可参考的公开案例。<\/p>\n<h2 id=\"section-6\">为什么自主 Rollout 数据重要<\/h2>\n<p>纯专家轨迹通常只覆盖专家会去的状态；机器人自己执行时可能抓偏、碰到障碍、掉落物体。收集这些轨迹并保留失败、干预、任务进度及结果标签，有机会训练更可靠的恢复策略。<\/p>\n<p>但<strong>不能把任何失败轨迹直接作为正确 BC target<\/strong>：必须结合数据质量、动作条件或 RL objective。<\/p>\n<h2 id=\"section-7\">推荐一起对照<\/h2>\n<p><a href=\"?page=training-loop\">从示范到训练的步骤<\/a> / <a href=\"?page=model-architecture\">VLA 与动作生成<\/a> / <a href=\"?page=company-1x\">1X World Model<\/a> / <a href=\"?page=company-pi\">Physical Intelligence 的自主学习<\/a>。<\/p>\n","toc":[{"level":2,"title":"Imitation Learning / Behavior Cloning","id":"section-1"},{"level":2,"title":"Reinforcement Learning","id":"section-2"},{"level":2,"title":"World Model","id":"section-3"},{"level":2,"title":"Inverse Dynamics Model（IDM）","id":"section-4"},{"level":2,"title":"World-Action Model（WAM）","id":"section-5"},{"level":2,"title":"为什么自主 Rollout 数据重要","id":"section-6"},{"level":2,"title":"推荐一起对照","id":"section-7"}],"words":1172},{"id":"model-architecture","section":"models","title":"VLA、Diffusion 与 Flow Matching","file":"model-architecture.md","summary":"理解模型架构与动作表示；为算法深挖预留可扩展章节。","tags":["VLA","Diffusion","Flow Matching","Action Chunk"],"related":["learning-paradigms","training-loop","company-pi"],"maturity":"概念速览","html":"<blockquote>\n<p>这一章先搭建模型词汇体系，后续可继续扩写公式、网络模块、PyTorch 实现和论文复现，不急于一次讲完。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">VLM 与 VLA<\/h2>\n<p><strong>VLM（Vision-Language Model）<\/strong> 处理视觉与语言的联合理解，典型输出可以是文字或结构化描述。<\/p>\n<p><strong>VLA（Vision-Language-Action Model）<\/strong> 则进一步把 observation 和语言条件映射到机器人动作（或 action chunks）。<\/p>\n<pre><code class=\"language-text\">Visual Observation + Language + Robot State\n                  ↓\n             VLA Policy\n                  ↓\n    Joint / EE / Gripper Action Chunk\n<\/code><\/pre>\n<h2 id=\"section-2\">Action Representation<\/h2>\n<p>机器人 policy 不一定输出相同类型的动作：<\/p>\n<table>\n<thead>\n<tr>\n  <th>动作表示<\/th>\n  <th>例子<\/th>\n  <th>意义<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Joint position<\/td>\n  <td><code>q_target<\/code><\/td>\n  <td>直接给关节位置目标<\/td>\n<\/tr>\n<tr>\n  <td>Joint velocity<\/td>\n  <td><code>dq/dt<\/code><\/td>\n  <td>速度命令<\/td>\n<\/tr>\n<tr>\n  <td>EE delta pose<\/td>\n  <td><code>Δx, Δy, Δz, Δrotation<\/code><\/td>\n  <td>在笛卡尔空间移动末端<\/td>\n<\/tr>\n<tr>\n  <td>Gripper action<\/td>\n  <td><code>open/close<\/code> or width<\/td>\n  <td>末端执行器命令<\/td>\n<\/tr>\n<tr>\n  <td>Whole-body command<\/td>\n  <td>base + arms + hands<\/td>\n  <td>多部位协同动作<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>动作表示决定训练数据需要怎样归一化、对齐以及在部署时怎样解码。<\/p>\n<h2 id=\"section-3\">Diffusion Policy<\/h2>\n<p>把连续动作序列看成需要生成的样本：训练模型从带噪声的动作逐步恢复合理的动作轨迹。适合表示多峰策略，例如同一个杯子可以从不同方向抓取。<\/p>\n<h2 id=\"section-4\">Flow Matching<\/h2>\n<p>学习把简单分布连续映射到目标动作分布的速度场。Physical Intelligence 的 π0 路线采用了 Flow Model 的思想。<\/p>\n<p>需要注意：<strong>Diffusion 与 Flow Matching 都是生成连续动作的建模方法<\/strong>，不等于整个 VLA 系统，也不替代观测编码、动作执行、安全约束和系统集成。<\/p>\n<h2 id=\"section-5\">Action Chunk 与实时执行<\/h2>\n<p>模型可以预测 H 步 future actions，再滚动执行和重新推理；动作时间尺度、执行频率、推理延迟与新感知的接入方式，都是部署时需要决定的系统参数。<\/p>\n<h2 id=\"section-6\">后续可以深入的技术分支<\/h2>\n<ul>\n<li>Transformer attention 如何连接视觉、语言与机器人状态<\/li>\n<li>Diffusion denoising objective、noise schedule、采样器<\/li>\n<li>Flow matching 的 ODE 观点和条件动作生成<\/li>\n<li>Action tokenizer / FAST 与 autoregressive action generation<\/li>\n<li>Multi-embodiment 训练时怎样统一 action space<\/li>\n<li>World Model + IDM + Policy 的系统架构<\/li>\n<\/ul>\n<p>入门资料：<a href=\"https://www.physicalintelligence.company/download/pi0.pdf\">π0 原始论文<\/a>、<a href=\"https://research.nvidia.com/labs/gear/gr00t-2/\">NVIDIA GR00T 2 官方研究<\/a>。<\/p>\n","toc":[{"level":2,"title":"VLM 与 VLA","id":"section-1"},{"level":2,"title":"Action Representation","id":"section-2"},{"level":2,"title":"Diffusion Policy","id":"section-3"},{"level":2,"title":"Flow Matching","id":"section-4"},{"level":2,"title":"Action Chunk 与实时执行","id":"section-5"},{"level":2,"title":"后续可以深入的技术分支","id":"section-6"}],"words":1091},{"id":"quality-evaluation","section":"evaluation","title":"Data Quality 与模型评估","file":"quality-evaluation.md","summary":"完整性、有效性、多样性、任务成功率与泛化评估。","tags":["Metrics","Evaluation","Quality"],"related":["data-comparison","data-pipeline","data-flywheel"],"maturity":"已整理","html":"<blockquote>\n<p><strong>Data Quality ≠ 清晰画面 + 正确标注。<\/strong> 真正有价值的数据，还要在正确的训练目标上对模型产生正向增益。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">数据质量的四个层级<\/h2>\n<table>\n<thead>\n<tr>\n  <th>层级<\/th>\n  <th>核心问题<\/th>\n  <th>典型检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Integrity<\/td>\n  <td>数据是否可信、能否正确对齐？<\/td>\n  <td>timestamp、camera calibration、schema、missing frame<\/td>\n<\/tr>\n<tr>\n  <td>Demonstration Quality<\/td>\n  <td>行动是否合理、标签是否正确？<\/td>\n  <td>action validity、task success、annotation consistency<\/td>\n<\/tr>\n<tr>\n  <td>Diversity / Coverage<\/td>\n  <td>覆盖了哪些实际变化？<\/td>\n  <td>task、object、environment、robot、failure mode<\/td>\n<\/tr>\n<tr>\n  <td>Model Utility<\/td>\n  <td>真的改善模型了吗？<\/td>\n  <td>held-out success、ablation、generalization、recovery<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-2\">为什么画质不是唯一标准？<\/h2>\n<ul>\n<li>高分辨率但 Camera/Action 错位的示范，可能对动作学习有害。<\/li>\n<li>模糊但正确标注失败恢复过程的数据，可能对某些恢复策略很有帮助。<\/li>\n<li>10,000 次高度重复的抓取，可能不如变化丰富的 100 次示范带来的泛化信息多。<\/li>\n<li>高度理想化仿真会让模型低估真实接触变化。<\/li>\n<\/ul>\n<h2 id=\"section-3\">训练损失下降，不等于真实成功率上升<\/h2>\n<p>模型在 offline validation 上预测专家 action 更准确，不代表闭环执行一定更可靠。真实系统会积累控制误差、引入延迟，并进入训练时没覆盖的状态。<\/p>\n<p>因此建议区分：<\/p>\n<ol>\n<li><strong>Offline Metrics<\/strong>：动作预测误差、重投影误差、数据一致性等；<\/li>\n<li><strong>Closed-loop Task Metrics<\/strong>：成功率、完成时间、干预率、碰撞/失败情况；<\/li>\n<li><strong>Generalization<\/strong>：未见环境、物体、指令、初始状态；<\/li>\n<li><strong>Operational Metrics<\/strong>：安全、恢复、延迟、可维护性和部署稳定性。<\/li>\n<\/ol>\n<h2 id=\"section-4\">A/B 与 Ablation 的重要性<\/h2>\n<p>评估某数据来源是否有价值，尽可能控制模型、训练预算和任务集不变，仅改变数据池或采样策略。例如：<\/p>\n<ul>\n<li>去掉人类视频预训练，unseen object success 是否下降？<\/li>\n<li>去掉失败/干预数据，恢复率是否下降？<\/li>\n<li>增加某一机器人平台的数据，对其他平台有无帮助？<\/li>\n<\/ul>\n<p><strong>跨公司的 60% vs 80% 如果任务定义、场景、硬件与成功标准不同，不能直接排名。<\/strong><\/p>\n<h2 id=\"section-5\">知识连接<\/h2>\n<p>数据质量影响 <a href=\"?page=data-recipe\">Data Recipe<\/a>，评估结果决定下一轮 <a href=\"?page=data-flywheel\">Data Flywheel<\/a> 应该采集什么，而 VIO / TF / Calibration 等基础工程问题又会直接影响数据完整性。<\/p>\n","toc":[{"level":2,"title":"数据质量的四个层级","id":"section-1"},{"level":2,"title":"为什么画质不是唯一标准？","id":"section-2"},{"level":2,"title":"训练损失下降，不等于真实成功率上升","id":"section-3"},{"level":2,"title":"A/B 与 Ablation 的重要性","id":"section-4"},{"level":2,"title":"知识连接","id":"section-5"}],"words":1012},{"id":"data-flywheel","section":"evaluation","title":"Data Flywheel 与部署反馈","file":"data-flywheel.md","summary":"真实部署、失败采集、纠错、持续改进和数据闭环。","tags":["Data Flywheel","Deployment","Feedback"],"related":["quality-evaluation","data-recipe","overview"],"maturity":"已整理","html":"<blockquote>\n<p><strong>Data Flywheel<\/strong> 不是把数据不停存储，而是“运行 → 发现问题 → 有针对性采集 → 模型改善 → 再部署”的正反馈系统。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">完整闭环<\/h2>\n<pre><code class=\"language-text\">Robot Deployment\n       ↓\nReal-world Execution\n       ↓\nData + Success / Failure / Intervention\n       ↓\nFailure Analysis &amp; Data Selection\n       ↓\nClean / Label / Balance / Mix\n       ↓\nTrain / Fine-tune / RL\n       ↓\nEvaluate on Held-out Real Tasks\n       ↓\nDeploy Better Policy\n       └────────────────→ New Experiences\n<\/code><\/pre>\n<p>其中每个箭头都值得追问。比如：部署是否覆盖不同环境？失败由谁定义？人工干预记录了什么？新数据如何避免重复？模型改善是否经过可比较的真实测试？<\/p>\n<h2 id=\"section-2\">一个 Pick &amp; Place 例子<\/h2>\n<ol>\n<li>V1 policy 学会从杯子顶部抓取，但碰到透明杯时频繁失败。<\/li>\n<li>系统检测失败并记录前后视频、动作轨迹、夹爪状态和失败类型。<\/li>\n<li>人类纠正或重新演示适用于透明杯的抓取策略。<\/li>\n<li>训练时提高透明物体/失败恢复数据的相对权重。<\/li>\n<li>使用未见过的新透明杯评估 V2 是否真正改善。<\/li>\n<li>将新模型部署到更多环境，继续采集新分布的失败。<\/li>\n<\/ol>\n<p>如果只是 V2 在原始训练集上表现更好，而真实场景没改善，这个飞轮并没有有效闭合。<\/p>\n<h2 id=\"section-3\">常见瓶颈<\/h2>\n<ul>\n<li><strong>Collection bottleneck<\/strong>：设备和操作员限制数据规模。<\/li>\n<li><strong>Quality bottleneck<\/strong>：时间错位、动作不可用、标注不一致。<\/li>\n<li><strong>Learning bottleneck<\/strong>：新增数据不适合当前模型或训练目标。<\/li>\n<li><strong>Evaluation bottleneck<\/strong>：缺乏统一、可重复且代表真实分布的评测。<\/li>\n<li><strong>Deployment bottleneck<\/strong>：推理延迟、安全策略、可靠性限制上线。<\/li>\n<\/ul>\n<h2 id=\"section-4\">行业里的不同实现<\/h2>\n<ul>\n<li><a href=\"?page=company-pi\">Physical Intelligence<\/a>：自主经验、人工纠正和奖励/质量信号帮助 policy improve。<\/li>\n<li><a href=\"?page=company-figure\">Figure<\/a>：扩大人类行为视频来源，并将训练能力应用于人形机器人。<\/li>\n<li><a href=\"?page=company-skild\">Skild AI<\/a>：强调多数据源组合和视频示范 In-Context Learning 的扩展性。<\/li>\n<li><a href=\"?page=company-nvidia\">NVIDIA<\/a>：通过大规模 human video + UMI + robot teleop 支持跨形态迁移。<\/li>\n<\/ul>\n<h2 id=\"section-5\">最核心的衡量方式<\/h2>\n<p>不是“每天又增加了多少小时视频”，而是 <strong>单位新增有效数据带来了多大可验证的模型能力增益<\/strong>。这一点把数据工程、ML 研究、机器人系统集成和产品部署连接成同一件事。<\/p>\n","toc":[{"level":2,"title":"完整闭环","id":"section-1"},{"level":2,"title":"一个 Pick & Place 例子","id":"section-2"},{"level":2,"title":"常见瓶颈","id":"section-3"},{"level":2,"title":"行业里的不同实现","id":"section-4"},{"level":2,"title":"最核心的衡量方式","id":"section-5"}],"words":1016},{"id":"industry-landscape","section":"industry","title":"行业路线总览与比较","file":"industry-landscape.md","summary":"八家公司在视频、遥操、仿真、机器人经验上的不同配方。","tags":["Companies","Data Recipe","Research"],"related":["company-nvidia","company-pi","company-figure","company-1x"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>行业 Data Recipe 比较必须以具体模型版本为单位。<\/strong> 同一家公司的总数据资产，不等于某一次训练实际用了全部数据；不同报告的小时数也可能有交叠。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">八家公司训练路线对照<\/h2>\n<table>\n<thead>\n<tr>\n  <th>公司 / 代表模型<\/th>\n  <th>突出数据来源<\/th>\n  <th>训练特色<\/th>\n  <th>尚需谨慎的地方<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><a href=\"?page=company-nvidia\">NVIDIA · GR00T 2<\/a><\/td>\n  <td>Human Ego + UMI + Robot Teleop<\/td>\n  <td>World-Action 联合学习<\/td>\n  <td>总小时数不等于 batch 比例<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-pi\">Physical Intelligence · π 系列<\/a><\/td>\n  <td>多机器人 + 自主经验 + 纠正<\/td>\n  <td>跨形态泛化与后训练<\/td>\n  <td>不同 π 版本不能混为一次训练<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-figure\">Figure · Helix / Index<\/a><\/td>\n  <td>人类行为视频、motion、robot<\/td>\n  <td>Humanoid transfer + whole-body<\/td>\n  <td>平台上传量不是训练使用量<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-1x\">1X · World Model<\/a><\/td>\n  <td>Human video + robot video/action<\/td>\n  <td>视频预测 + IDM<\/td>\n  <td>数据量分属不同阶段<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-google\">Google · Gemini Robotics<\/a><\/td>\n  <td>VLM + multi-robot + simulation<\/td>\n  <td>多机器人迁移 + AI 辅助仿真<\/td>\n  <td>未公开完整训练配比<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-toyota\">Toyota TRI · LBM<\/a><\/td>\n  <td>Robot teleop + UMI + Simulation + OXE<\/td>\n  <td>多任务 diffusion policy<\/td>\n  <td>任务集与其他公司不可直接对照<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-agibot\">AgiBot · GE-Act 2.0<\/a><\/td>\n  <td>Video + action trajectories + failure<\/td>\n  <td>世界/动作分阶段预训练<\/td>\n  <td>数据池存在交叠<\/td>\n<\/tr>\n<tr>\n  <td><a href=\"?page=company-skild\">Skild AI · S1<\/a><\/td>\n  <td>Teleop + UMI + Ego + Sim<\/td>\n  <td>视频示范 In-Context Learning<\/td>\n  <td>未公开完整 mixer 权重<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-2\">三条值得关注的行业线索<\/h2>\n<h3 id=\"section-3\">1. 真实机器人示范仍然不可轻易替代<\/h3>\n<p>它们与目标执行器、物理接触和动作控制最接近，但受硬件、操作员和时间限制。很多公司在扩大机器人示范之外，也在寻找低成本数据来源。<\/p>\n<h3 id=\"section-4\">2. 利用无原生机器人动作的人类视频<\/h3>\n<p>NVIDIA、Figure、1X 等公开研究表明，大规模人类视频可以帮助学习可迁移的任务/物理先验。但如何把视频映射为机器人可执行 action，仍然需要模型设计、适配数据或其他监督。<\/p>\n<h3 id=\"section-5\">3. 从纯示范走向真实机器人试错<\/h3>\n<p>Physical Intelligence 等公司公开的自主 rollout、纠正、反馈路线说明：<strong>机器人自己执行产生的状态分布<\/strong>对鲁棒性和恢复能力很重要。<\/p>\n<h2 id=\"section-6\">读公司报告的五个核对问题<\/h2>\n<ol>\n<li>这是公司的<strong>全部数据资产<\/strong>，还是某个具体模型的<strong>训练池<\/strong>？<\/li>\n<li>“hours” 是 raw collected hours、filtered hours、还是 sampled training hours？<\/li>\n<li>数据是 <strong>pretraining / alignment / fine-tuning / RL<\/strong> 哪个阶段？<\/li>\n<li>是否公开训练 sample ratio、loss/objective 和关键 ablation？<\/li>\n<li>报告的是 offline metric、simulation benchmark 还是真实机器人任务成功率？<\/li>\n<\/ol>\n<h2 id=\"section-7\">研究快照说明<\/h2>\n<p>本专题资料核对截至 <strong>2026-11-19<\/strong>。公司公开博客、论文及自报实验随时间更新。下列个案均尽量附官方原始链接；没有披露的配方细节标注为未知，而不以行业习惯替代事实。<\/p>\n","toc":[{"level":2,"title":"八家公司训练路线对照","id":"section-1"},{"level":2,"title":"三条值得关注的行业线索","id":"section-2"},{"level":3,"title":"1. 真实机器人示范仍然不可轻易替代","id":"section-3"},{"level":3,"title":"2. 利用无原生机器人动作的人类视频","id":"section-4"},{"level":3,"title":"3. 从纯示范走向真实机器人试错","id":"section-5"},{"level":2,"title":"读公司报告的五个核对问题","id":"section-6"},{"level":2,"title":"研究快照说明","id":"section-7"}],"words":1248},{"id":"company-nvidia","section":"industry","title":"NVIDIA · GR00T 2","file":"company-nvidia.md","summary":"402,730h 人类视频、10,184h UMI 与 23,500h 遥操。","tags":["NVIDIA","GR00T","WAM"],"related":["data-recipe","company-agibot"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>NVIDIA GR00T 2：Human Video + UMI + Robot Teleoperation → World-Action Model。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">公开的预训练数据<\/h2>\n<table>\n<thead>\n<tr>\n  <th>类型<\/th>\n  <th style=\"text-align:right\">时长<\/th>\n  <th>用途直觉<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Human egocentric video<\/td>\n  <td style=\"text-align:right\"><strong>402,730 h<\/strong><\/td>\n  <td>广泛的人类操作与物理世界变化<\/td>\n<\/tr>\n<tr>\n  <td>Handheld UMI demonstrations<\/td>\n  <td style=\"text-align:right\"><strong>10,184 h<\/strong><\/td>\n  <td>带操作轨迹的跨任务示范（2,897 个任务）<\/td>\n<\/tr>\n<tr>\n  <td>Robot teleoperation<\/td>\n  <td style=\"text-align:right\"><strong>23,500 h<\/strong><\/td>\n  <td>真实机器人动作与 embodiment 对齐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这些数字来自 <a href=\"https://research.nvidia.com/labs/gear/gr00t-2/\">NVIDIA GEAR 官方 GR00T 2 技术报告<\/a>，属于披露的预训练数据池，并不等于总训练 token 配比。研究中还覆盖不同机器人、夹爪和灵巧手平台。<\/p>\n<h2 id=\"section-2\">核心技术思路<\/h2>\n<p>GR00T 2 使用 <strong>World-Action Model（WAM）<\/strong>，联合生成未来视觉内容与机器人动作。它尝试让大规模人类视频中的物理交互知识，帮助机器人形成能泛化的行为表征。<\/p>\n<pre><code class=\"language-text\">Ego Human Video ────┐\nUMI Demonstrations ─┼──&gt; World-Action Pretraining\nRobot Teleoperation ┘             ↓\n                        Adapt to Target Robot\n                                  ↓\n                         Robot Action Prediction\n<\/code><\/pre>\n<h2 id=\"section-3\">如何正确理解实验结果<\/h2>\n<p>官方报告通过受控实验分析了人类视频规模对机器人任务表现的影响，并报告在其特定 72 项任务评价中平均任务进度提升。<strong>Task progress 与 Task success rate 并不是同一个指标<\/strong>，不能据此判断在所有机器人任务上成功率相同。<\/p>\n<h2 id=\"section-4\">研究意义<\/h2>\n<ul>\n<li>人类视频提供数据规模和任务多样性。<\/li>\n<li>UMI 作为人类操作到机器人动作空间的桥梁。<\/li>\n<li>Robot teleop 为物理可执行动作提供关键约束。<\/li>\n<li>World-Action 目标将视觉未来与动作训练连接起来。<\/li>\n<\/ul>\n<p><strong>仍未知<\/strong>：完整的所有阶段 mixture 权重、去重规则和目标机器人适配细节。相关背景：<a href=\"?page=data-recipe\">Data Recipe<\/a>、<a href=\"?page=learning-paradigms\">World Model<\/a>。<\/p>\n<p>官方来源：<a href=\"https://research.nvidia.com/labs/gear/gr00t-2/\">GR00T 2 Research<\/a>。<\/p>\n","toc":[{"level":2,"title":"公开的预训练数据","id":"section-1"},{"level":2,"title":"核心技术思路","id":"section-2"},{"level":2,"title":"如何正确理解实验结果","id":"section-3"},{"level":2,"title":"研究意义","id":"section-4"}],"words":817},{"id":"company-pi","section":"industry","title":"Physical Intelligence · π 系列","file":"company-pi.md","summary":"跨机器人预训练、机器人自主经验与可控策略。","tags":["Physical Intelligence","π0","RL"],"related":["learning-paradigms","company-toyota"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>Physical Intelligence：跨机器人预训练 → 新任务适配 → 从真实机器人自身经验继续学习。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">关键模型演进<\/h2>\n<table>\n<thead>\n<tr>\n  <th>模型<\/th>\n  <th>主要研究方向<\/th>\n  <th>从数据角度理解<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>π0<\/td>\n  <td>大规模多机器人、多任务 VLA<\/td>\n  <td>尝试学统一的通用操作策略<\/td>\n<\/tr>\n<tr>\n  <td>π0.5<\/td>\n  <td>开放环境泛化<\/td>\n  <td>混合机器人数据、视觉语言与语义任务信息<\/td>\n<\/tr>\n<tr>\n  <td>π*0.6 / RECAP<\/td>\n  <td>Experience-based policy improvement<\/td>\n  <td>示范、自主 rollout、人类纠正、反馈/奖励<\/td>\n<\/tr>\n<tr>\n  <td>π0.7<\/td>\n  <td>可控行为与丰富条件信息<\/td>\n  <td>结合 quality、speed、control modality、subgoal 等条件<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这些属于<strong>不同模型/不同研究阶段<\/strong>，不能合并成一份固定的公司训练配方。<\/p>\n<h2 id=\"section-2\">为什么 Multi-Robot 数据重要？<\/h2>\n<p>不同机器人形态、运动范围、夹爪与任务数据并不完全相同。研究者希望从异构数据中学习共性，再利用目标平台特定数据进行调整。<\/p>\n<pre><code class=\"language-text\">Robot A Data ──┐\nRobot B Data ──┼── Shared Policy / Representation\nRobot C Data ──┘                 ↓\n                        Target-Robot Adaptation\n<\/code><\/pre>\n<h2 id=\"section-3\">为什么 RECAP / 自主经验重要？<\/h2>\n<p>模仿学习主要覆盖人类专家行为；自主运行会产生专家示范不常出现的失效状态。通过 human correction 和奖励信息，策略可以逐步改善真实闭环表现。但要区分行动的<strong>质量和结果<\/strong>，不能把全部 rollout 当作专家示范。<\/p>\n<h2 id=\"section-4\">为什么 π0.7 的质量条件很有意思？<\/h2>\n<p>如果训练数据混合了快而准确的操作与慢/失败操作，训练时引入质量、速度或控制条件，可以告诉模型希望输出何种行为，而不是默认每段轨迹同样值得模仿。<\/p>\n<h2 id=\"section-5\">资料与局限<\/h2>\n<p>参考：<a href=\"https://www.physicalintelligence.company/download/pi0.pdf\">π0 原始论文<\/a>、<a href=\"https://www.physicalintelligence.company/blog/pi0\">π0 官方介绍<\/a>。完整的内部数据比例并未公开；请勿把新闻中不同版本的数量拼成一组精确 recipe。<\/p>\n<p>关联：<a href=\"?page=learning-paradigms\">Behavior Cloning / RL<\/a>、<a href=\"?page=data-flywheel\">Data Flywheel<\/a>。<\/p>\n","toc":[{"level":2,"title":"关键模型演进","id":"section-1"},{"level":2,"title":"为什么 Multi-Robot 数据重要？","id":"section-2"},{"level":2,"title":"为什么 RECAP / 自主经验重要？","id":"section-3"},{"level":2,"title":"为什么 π0.7 的质量条件很有意思？","id":"section-4"},{"level":2,"title":"资料与局限","id":"section-5"}],"words":761},{"id":"company-figure","section":"industry","title":"Figure · Helix / Index","file":"company-figure.md","summary":"全球人类行为视频、全身运动与具身迁移。","tags":["Figure","Helix","Index"],"related":["data-taxonomy","company-nvidia"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>Figure：通过大规模人类行为视频拓展任务范围，同时使用运动数据、仿真和机器人数据解决整机控制。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Index：扩大 Human Behavior Data<\/h2>\n<p>Figure 在 <strong>2026-08-25<\/strong> 公布 Index 数据采集平台，其官方报告包括：<\/p>\n<ul>\n<li>超过 <strong>1,600 万<\/strong>条上传视频；<\/li>\n<li>来源覆盖 <strong>100+<\/strong> 个国家；<\/li>\n<li>每秒接收约 <strong>30 分钟视频<\/strong>（当时公告口径）；<\/li>\n<li>通过 filtering、deduplication、distribution rebalancing 和 annotation 建立训练数据处理流程。<\/li>\n<\/ul>\n<p><strong>特别注意<\/strong>：Index 的上传量属于<strong>数据采集平台规模<\/strong>，不是 Helix 一次训练使用的有效视频总量。参考 <a href=\"https://www.figure.ai/news/introducing-index\">Index 官方公告<\/a>。<\/p>\n<h2 id=\"section-2\">Helix 2.5：视频预训练向新家居环境泛化<\/h2>\n<p>Figure 在 2026-09-17 的 <a href=\"https://www.figure.ai/news/helix-2-5-zero-shot-30-home-generalization\">Helix 2.5 报告<\/a> 中介绍了 Index pretraining 及在 <strong>30 个未见家庭<\/strong>上的任务评估，并进行了从头训练与预训练的对照。属于公司自报、特定测试设置的结果，不能视作全行业统一基准。<\/p>\n<h2 id=\"section-3\">Helix 02：全身运动的不同数据需求<\/h2>\n<p>另一条训练链关注 whole-body controller。Figure 报告：<\/p>\n<table>\n<thead>\n<tr>\n  <th>数据/训练方式<\/th>\n  <th>公开信息<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Retargeted human motion<\/td>\n  <td><strong>1,000+ h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Parallel simulation environments<\/td>\n  <td><strong>200,000+<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这类 joint-level human motion + sim-to-real 训练，与人类日常操作视频对应的学习目标不同。参见 <a href=\"https://www.figure.ai/news/helix-02\">Helix 02: Full-Body Autonomy<\/a>。<\/p>\n<h2 id=\"section-4\">核心理解<\/h2>\n<p>同一家公司可以存在多种 recipe：上层视觉任务理解更依赖广泛 Human Video；低层平衡和全身控制更依赖动作轨迹、动力学和仿真；真实机器人数据则继续对齐执行能力。<\/p>\n","toc":[{"level":2,"title":"Index：扩大 Human Behavior Data","id":"section-1"},{"level":2,"title":"Helix 2.5：视频预训练向新家居环境泛化","id":"section-2"},{"level":2,"title":"Helix 02：全身运动的不同数据需求","id":"section-3"},{"level":2,"title":"核心理解","id":"section-4"}],"words":726},{"id":"company-1x","section":"industry","title":"1X · NEO / World Model","file":"company-1x.md","summary":"从生成未来视频到预测执行动作的训练路线。","tags":["1X","World Model","IDM"],"related":["learning-paradigms","company-agibot"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>1X：先用视频预测未来，再把未来视觉变化转成机器人动作。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">1X World Model 公开的训练量<\/h2>\n<table>\n<thead>\n<tr>\n  <th>环节<\/th>\n  <th style=\"text-align:right\">数据量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Egocentric human video mid-training<\/td>\n  <td style=\"text-align:right\"><strong>900 h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Robot embodiment fine-tuning<\/td>\n  <td style=\"text-align:right\"><strong>70 h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Inverse Dynamics Model training<\/td>\n  <td style=\"text-align:right\"><strong>400 h<\/strong> robot data<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>以上属于官方公开的一个具体 World Model 实验配方。它们<strong>服务于不同训练目标<\/strong>，不能简单加起来说“总共 1,370 小时同一种训练数据”。<\/p>\n<p>原始来源：<a href=\"https://www.1x.tech/discover/world-model-self-learning\">1X World Model — From Video to Action<\/a>。<\/p>\n<h2 id=\"section-2\">模型流程<\/h2>\n<pre><code class=\"language-text\">Current Frame + Language Instruction\n                  ↓\n              World Model\n                  ↓\n          Predicted Future Video\n                  ↓\n         Inverse Dynamics Model\n                  ↓\n           Robot Action Sequence\n                  ↓\n                 NEO\n<\/code><\/pre>\n<p><strong>World Model<\/strong> 学习物体和环境在时间中的变化；<strong>IDM<\/strong> 学习什么动作能导致从前一帧转移到后一帧。<\/p>\n<h2 id=\"section-3\">为什么 400h 的 IDM Data 可以和 900h Human Video 互补？<\/h2>\n<p>Human Video 通常没有 NEO 的原生 motor commands，但有丰富的环境变化；Robot Action Data 可以告诉 IDM 某类画面变化与机器人的执行命令如何对应。<\/p>\n<h2 id=\"section-4\">主要局限<\/h2>\n<p>视觉上合理的未来不保证物理可行；状态转移可能由多种动作产生；IDM 估计的动作还需要真实系统验证。<\/p>\n<p>关联：<a href=\"?page=learning-paradigms\">World Model / IL / RL<\/a>、<a href=\"?page=data-taxonomy\">数据来源<\/a>。<\/p>\n","toc":[{"level":2,"title":"1X World Model 公开的训练量","id":"section-1"},{"level":2,"title":"模型流程","id":"section-2"},{"level":2,"title":"为什么 400h 的 IDM Data 可以和 900h Human Video 互补？","id":"section-3"},{"level":2,"title":"主要局限","id":"section-4"}],"words":619},{"id":"company-google","section":"industry","title":"Google DeepMind · Gemini Robotics","file":"company-google.md","summary":"VLM 基础、多机器人迁移与 AI 辅助仿真。","tags":["Google DeepMind","Gemini Robotics","Simulation"],"related":["company-nvidia","model-architecture"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>Google DeepMind：通用 VLM / Embodied Reasoning + 机器人动作模型 + 多机器人学习 + AI 辅助仿真。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Open X-Embodiment 的价值<\/h2>\n<p>Google DeepMind 与研究合作伙伴汇集了：<\/p>\n<ul>\n<li><strong>100 万+<\/strong> robot episodes；<\/li>\n<li><strong>22 种<\/strong> robot embodiments；<\/li>\n<li><strong>500+<\/strong> 技能。<\/li>\n<\/ul>\n<p>目标是将多样机器人经验汇集到共享训练体系。这里的 <strong>Open X-Embodiment 数据资产<\/strong>不能直接视为某个新版 Gemini Robotics 模型的完整训练集。<\/p>\n<p>来源：<a href=\"https://deepmind.google/blog/scaling-up-learning-across-many-different-robot-types/\">Google DeepMind — Scaling up learning across many different robot types<\/a>。<\/p>\n<h2 id=\"section-2\">Gemini Robotics 2.5（2026-11-10）<\/h2>\n<p>Google DeepMind 公告介绍使用 <strong>Gemini 4 Argon<\/strong> 辅助仿真/生成练习，提升训练场景构建及机器人能力开发效率，并将 embodied reasoning 和机器人 action model 分工连接到真实控制。<\/p>\n<p>来源：<a href=\"https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/\">Gemini Robotics 2.5: Accelerating Physical Intelligence<\/a>。<\/p>\n<h2 id=\"section-3\">关键技术观点<\/h2>\n<ul>\n<li>通用视觉语言模型可提供语义与世界知识；<\/li>\n<li>实际机器人需要专门的低层动作模型；<\/li>\n<li>多机器人数据支持跨形态泛化；<\/li>\n<li>仿真扩展实验和场景覆盖，但真实世界验证不可省略。<\/li>\n<\/ul>\n<p><strong>未披露<\/strong>：Gemini Robotics 2.5 完整训练数据配比与训练 token allocation，因此不能从博客推导精确比例。<\/p>\n","toc":[{"level":2,"title":"Open X-Embodiment 的价值","id":"section-1"},{"level":2,"title":"Gemini Robotics 2.5（2026-11-10）","id":"section-2"},{"level":2,"title":"关键技术观点","id":"section-3"}],"words":623},{"id":"company-toyota","section":"industry","title":"Toyota Research Institute · LBM","file":"company-toyota.md","summary":"468h 遥操、45h 仿真、32h UMI 与 1,150h 开放数据。","tags":["Toyota","LBM","Diffusion"],"related":["data-recipe","model-architecture"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>Toyota Research Institute 的 Large Behavior Model（LBM）特别适合研究“公开且可核对的多来源数据配方”。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">公开数据池<\/h2>\n<table>\n<thead>\n<tr>\n  <th>数据来源<\/th>\n  <th style=\"text-align:right\">小时数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Internally collected bimanual robot teleoperation<\/td>\n  <td style=\"text-align:right\"><strong>468 h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Simulation-collected teleoperation<\/td>\n  <td style=\"text-align:right\"><strong>45 h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Universal Manipulation Interface（UMI）<\/td>\n  <td style=\"text-align:right\"><strong>32 h<\/strong><\/td>\n<\/tr>\n<tr>\n  <td>Curated Open X-Embodiment data<\/td>\n  <td style=\"text-align:right\"><strong>约 1,150 h<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>来源：<a href=\"https://toyotaresearchinstitute.github.io/lbm1/\">A Careful Examination of Large Behavior Models for Multitask Dexterous Manipulation<\/a>。<\/p>\n<h2 id=\"section-2\">训练路线<\/h2>\n<p>模型使用多任务的机器人操作数据来训练能够直接生成动作的 policy，其中包含 diffusion-style action generation，并进行实际机器人任务上的评估。<\/p>\n<h2 id=\"section-3\">为什么这组数据很有教学价值？<\/h2>\n<p>它同时包含：<\/p>\n<ol>\n<li><strong>自己的真实机器人遥操<\/strong>：目标平台动作质量较高；<\/li>\n<li><strong>对应仿真遥操<\/strong>：扩展场景和轨迹；<\/li>\n<li><strong>UMI<\/strong>：用手持操作设备产生额外示范；<\/li>\n<li><strong>Open X-Embodiment<\/strong>：引入跨机器人多任务知识。<\/li>\n<\/ol>\n<p>与单一数据源相比，混合数据有机会扩大任务覆盖和泛化，但必须配合动作规范化及有效评估。<\/p>\n<h2 id=\"section-4\">注意数据比较口径<\/h2>\n<p>这是一篇研究公开的特定 LBM 配方，并不能代表 TRI 所有模型或更新版本。官方报告中的内部任务与其他公司评测协议不同，<strong>不能直接横向比较成功率<\/strong>。<\/p>\n<p>关联：<a href=\"?page=data-recipe\">Data Recipe<\/a> / <a href=\"?page=model-architecture\">Diffusion Policy<\/a>。<\/p>\n","toc":[{"level":2,"title":"公开数据池","id":"section-1"},{"level":2,"title":"训练路线","id":"section-2"},{"level":2,"title":"为什么这组数据很有教学价值？","id":"section-3"},{"level":2,"title":"注意数据比较口径","id":"section-4"}],"words":658},{"id":"company-agibot","section":"industry","title":"AgiBot · GE-Act 2.0","file":"company-agibot.md","summary":"World-Action 联合训练与不同数据监督信号。","tags":["AgiBot","World-Action","IDM"],"related":["company-nvidia","company-1x"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>AgiBot GE-Act 2.0：将视频世界预测、逆动力学和世界-动作联合训练分层处理。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">三个训练阶段的公开数据量<\/h2>\n<table>\n<thead>\n<tr>\n  <th>学习阶段<\/th>\n  <th style=\"text-align:right\">时长<\/th>\n  <th>主要作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>World / Visual Pretraining<\/td>\n  <td style=\"text-align:right\"><strong>39,000 h<\/strong><\/td>\n  <td>学习环境和物体随时间如何变化<\/td>\n<\/tr>\n<tr>\n  <td>Inverse Dynamics Pretraining<\/td>\n  <td style=\"text-align:right\"><strong>32,000 h<\/strong><\/td>\n  <td>学习视觉状态变化与机器人动作的对应<\/td>\n<\/tr>\n<tr>\n  <td>Joint World-Action Training<\/td>\n  <td style=\"text-align:right\"><strong>30,000 h<\/strong><\/td>\n  <td>联合学习视觉未来与动作<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>该研究还讨论了 3,000 小时不含机器人动作标签的人类视频，以及约 2,000 小时失败操作和真实部署数据。<strong>不同阶段的数据池可能交叠，不可简单相加。<\/strong><\/p>\n<p>官方资料：<a href=\"https://www.agibot.com/news/newsroom/agibot-releases-ge-act-2-0-providing-the-120\">AgiBot GE-Act 2.0 公告<\/a>；<a href=\"https://declare-lab.github.io/projects/ge-act-2/\">研究项目页面<\/a>。<\/p>\n<h2 id=\"section-2\">核心结构<\/h2>\n<pre><code class=\"language-text\">Instruction + Video ──&gt; World Prediction\nRobot Trajectories ────&gt; Inverse Dynamics\n             \\           /\n             World-Action Joint Training\n                         ↓\n                  Robot Action Policy\n<\/code><\/pre>\n<h2 id=\"section-3\">Scaling Experiment<\/h2>\n<p>官方研究报告在 <strong>300、1,200、5,000、30,000h<\/strong> 等规模上比较模型表现，研究数据规模与任务成功率之间的关系。它是一组特定硬件、任务和测试条件下的 scaling observation，不应直接推导所有机器人任务的统一 Scaling Law。<\/p>\n<h2 id=\"section-4\">有价值的知识点<\/h2>\n<p><strong>Action-free video 并非不能训练机器人基础模型；关键是目标函数需要匹配数据的监督能力。<\/strong> 同时，失败轨迹经过正确处理也可以成为价值较高的学习来源。<\/p>\n","toc":[{"level":2,"title":"三个训练阶段的公开数据量","id":"section-1"},{"level":2,"title":"核心结构","id":"section-2"},{"level":2,"title":"Scaling Experiment","id":"section-3"},{"level":2,"title":"有价值的知识点","id":"section-4"}],"words":654},{"id":"company-skild","section":"industry","title":"Skild AI · S1","file":"company-skild.md","summary":"混合数据引擎与单视频示范的 In-Context Learning。","tags":["Skild AI","ICL","Data Engine"],"related":["data-comparison","company-figure"],"maturity":"研究快照","html":"<blockquote>\n<p><strong>Skild AI S1：多来源 Data Engine + 通过单个视频示范进行 In-Context Learning。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">四种数据来源的权衡<\/h2>\n<p>Skild 的公开文章讨论：<\/p>\n<ul>\n<li>Robot Teleoperation：接近硬件动作空间，成本和扩展性是挑战；<\/li>\n<li>UMI：比传统 robot teleop 更方便扩展，但存在 embodiment mapping；<\/li>\n<li>Egocentric Human Video：规模扩展更强，但缺乏目标机器人 action；<\/li>\n<li>Simulation：容易并行化，但要解决现实迁移。<\/li>\n<\/ul>\n<p>这是一个非常适合理解 <strong>Hardware Proximity × Diversity × Scalability<\/strong> 三方 trade-off 的框架。<\/p>\n<h2 id=\"section-2\">S1 的 In-Context Learning<\/h2>\n<p>在其公开研究演示中，S1 可以接收一段任务演示视频作为上下文，让机器人尝试执行此前未见的任务，而不必每次通过 gradient fine-tuning 更新模型参数。<\/p>\n<p>这与经典“给一个任务采集大量遥操数据，再逐任务微调”的流程不同。<\/p>\n<h2 id=\"section-3\">与 Data Flywheel 的关系<\/h2>\n<p>如果单个视频能够指导新任务，任务上线与新行为数据采集的周期可能缩短。但这种能力仍要在环境变化、硬件条件和长时间执行中严格测试。<\/p>\n<p>来源：<a href=\"https://www.skild.ai/blogs/s1\">Skild AI — Introducing S1<\/a>。公司并未公开完整 Data Mixer、采样权重和所有训练阶段的数据比例。<\/p>\n<p>关联：<a href=\"?page=data-taxonomy\">数据分类<\/a> / <a href=\"?page=learning-paradigms\">模型学习范式<\/a>。<\/p>\n","toc":[{"level":2,"title":"四种数据来源的权衡","id":"section-1"},{"level":2,"title":"S1 的 In-Context Learning","id":"section-2"},{"level":2,"title":"与 Data Flywheel 的关系","id":"section-3"}],"words":577},{"id":"robotics-stack","section":"foundations","title":"机器人数据链与基础系统","file":"robotics-stack.md","summary":"相机、IMU、编码器、URDF、TF、VIO、SLAM 如何串起来。","tags":["Robotics","IMU","VIO","SLAM"],"related":["geometry-and-frames","sensors-and-estimation","data-pipeline"],"maturity":"概念速览","html":"<blockquote>\n<p>机器人学习不只关心神经网络：Sensor、Coordinate、Kinematics、Logging 与 Runtime Control 会直接决定训练数据质量及策略是否可执行。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">从机器人硬件到学习数据<\/h2>\n<pre><code class=\"language-text\">Camera / LiDAR / IMU / Encoder\n              ↓\n    Timestamped Observations\n              ↓\n      State Estimation\n         VIO / SLAM\n              ↓\n  Coordinate Frames / TF Tree\n              ↓\n    Robot State &amp; Actions\n              ↓\n   MCAP → Dataset Pipeline\n              ↓\n      VLA / Policy Model\n              ↓\n  IK / Planner / Controller\n              ↓\n    Motor / Actuator\n<\/code><\/pre>\n<h2 id=\"section-2\">关键概念如何分工<\/h2>\n<table>\n<thead>\n<tr>\n  <th>技术<\/th>\n  <th>它回答的问题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Camera / Depth<\/td>\n  <td>周围看到了什么，物体在哪里？<\/td>\n<\/tr>\n<tr>\n  <td>Encoder<\/td>\n  <td>电机轴/关节转了多少，转得多快？<\/td>\n<\/tr>\n<tr>\n  <td>IMU<\/td>\n  <td>设备如何加速和旋转？<\/td>\n<\/tr>\n<tr>\n  <td>VIO<\/td>\n  <td>用 Camera + IMU 估计连续运动？<\/td>\n<\/tr>\n<tr>\n  <td>SLAM<\/td>\n  <td>如何同时定位并建图？<\/td>\n<\/tr>\n<tr>\n  <td>URDF<\/td>\n  <td>机器人有哪些 links / joints？<\/td>\n<\/tr>\n<tr>\n  <td>TF Tree<\/td>\n  <td>不同 frames 在某个时刻如何变换？<\/td>\n<\/tr>\n<tr>\n  <td>FK<\/td>\n  <td>已知关节角，末端在哪里？<\/td>\n<\/tr>\n<tr>\n  <td>IK<\/td>\n  <td>已知目标末端 pose，关节应怎样配置？<\/td>\n<\/tr>\n<tr>\n  <td>MCAP<\/td>\n  <td>如何记录多模态时间序列消息？<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-3\">为什么这会影响 Data Recipe？<\/h2>\n<p>如果 camera-to-base 外参不准确、action 时间戳错位，模型可能学到错误动作。如果 URDF 的 joint axis 定义错了，IK 或运动规划会生成错误解。上游工程问题最终会表现为数据质量和闭环执行失败。<\/p>\n<h2 id=\"section-4\">推荐的自然延伸<\/h2>\n<p>可以直接点击 <a href=\"?page=geometry-and-frames\">坐标系、URDF、TF、FK/IK<\/a> 或 <a href=\"?page=sensors-and-estimation\">IMU、Camera、VIO、SLAM<\/a>。这里仅作为连接知识的入口，不要求按固定顺序学习。<\/p>\n","toc":[{"level":2,"title":"从机器人硬件到学习数据","id":"section-1"},{"level":2,"title":"关键概念如何分工","id":"section-2"},{"level":2,"title":"为什么这会影响 Data Recipe？","id":"section-3"},{"level":2,"title":"推荐的自然延伸","id":"section-4"}],"words":699},{"id":"geometry-and-frames","section":"foundations","title":"坐标系、URDF、TF、FK 与 IK","file":"geometry-and-frames.md","summary":"用一台移动机械臂理解空间关系和运动学。","tags":["URDF","TF","FK","IK","Pose"],"related":["robotics-stack","sensors-and-estimation"],"maturity":"概念速览","html":"<blockquote>\n<p><strong>URDF 定义机器人结构；TF Tree 描述运行时坐标系变换；FK/IK 负责在关节空间与末端位姿之间换算。<\/strong><\/p>\n<\/blockquote>\n<h2 id=\"section-1\">坐标系和右手定则<\/h2>\n<p>机器人常用右手坐标系，例如 ROS 常见 base frame：<code>+X forward, +Y left, +Z up<\/code>。正旋转方向遵循右手定则：大拇指指向正轴，四指弯曲方向是正转。<strong>从正轴方向朝原点看，正转是逆时针<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n  <th>角度<\/th>\n  <th>对应轴<\/th>\n  <th>常见直觉<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Roll<\/td>\n  <td>X<\/td>\n  <td>左右侧倾<\/td>\n<\/tr>\n<tr>\n  <td>Pitch<\/td>\n  <td>Y<\/td>\n  <td>抬头/低头<\/td>\n<\/tr>\n<tr>\n  <td>Yaw<\/td>\n  <td>Z<\/td>\n  <td>左右转向<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Pose 含三维位置 + 三个旋转自由度。软件内部可能使用 quaternion <code>(qx,qy,qz,qw)<\/code>，虽然有四个数，仍只有 3 个旋转 DoF。<\/p>\n<h2 id=\"section-2\">URDF = 结构描述<\/h2>\n<p>URDF（Unified Robot Description Format）使用 XML 描述 link、joint、几何、惯量和连接关系。比如：<\/p>\n<pre><code class=\"language-xml\">&lt;joint name=&quot;camera_joint&quot; type=&quot;fixed&quot;&gt;\n  &lt;parent link=&quot;base_link&quot;/&gt;\n  &lt;child link=&quot;camera_link&quot;/&gt;\n  &lt;origin xyz=&quot;0.3 0 0.5&quot; rpy=&quot;0 0 0&quot;/&gt;\n&lt;/joint&gt;\n<\/code><\/pre>\n<p>它表达 <code>camera_link<\/code> 相对 <code>base_link<\/code> 前方 0.3m、上方 0.5m，且没有额外旋转。<strong>joint 的 parent / child 在 URDF 里指的是 link；TF 中的 parent / child 指 frame。<\/strong><\/p>\n<h2 id=\"section-3\">TF Tree = 当前坐标变换关系<\/h2>\n<pre><code class=\"language-text\">map\n ↓\nodom\n ↓\nbase_link\n ↓\nshoulder_link\n ↓\nelbow_link\n ↓\ncamera_link\n<\/code><\/pre>\n<p>机器人移动时 <code>odom → base_link<\/code> 改变；机械臂转动时 <code>shoulder_link → elbow_link<\/code> 改变。URDF 不需要改变，但 TF 的时间相关数值会更新。URDF + joint states 可由 robot_state_publisher 计算内部 kinematic transforms；<code>map → odom<\/code> 及 <code>odom → base_link<\/code> 通常来自定位/里程计系统。<\/p>\n<p>若用 <code>T_A_B<\/code> 表示把 B frame 中的点变到 A frame，则：<\/p>\n<pre><code class=\"language-text\">T_map_camera = T_map_odom · T_odom_base · T_base_camera\np_map = T_map_camera · p_camera  （齐次坐标）\n<\/code><\/pre>\n<h2 id=\"section-4\">FK（正运动学）<\/h2>\n<p>知道关节状态，沿机器人 kinematic chain 逐级连乘 transform，求 end-effector pose。<\/p>\n<p>二维两连杆例子：<\/p>\n<pre><code class=\"language-text\">x = L1·cos(θ1) + L2·cos(θ1+θ2)\ny = L1·sin(θ1) + L2·sin(θ1+θ2)\n<\/code><\/pre>\n<h2 id=\"section-5\">IK（逆运动学）<\/h2>\n<p>已知 target end-effector pose，反过来求 joint angles。通常有 analytical solution、Jacobian numerical IK 和 constrained optimization 三类思路。<\/p>\n<ul>\n<li><strong>可能多解<\/strong>：elbow-up / elbow-down。<\/li>\n<li><strong>可能无解<\/strong>：目标超出工作空间或 joint limits。<\/li>\n<li><strong>通常不负责完整安全路径<\/strong>：从当前姿态到目标姿态的无碰撞 trajectory 往往交给 motion planning。<\/li>\n<\/ul>\n<h2 id=\"section-6\">Camera Intrinsics 与 Extrinsics<\/h2>\n<p>Intrinsics（如 <code>fx, fy, cx, cy<\/code>）决定 Camera 3D point 如何投影到 image pixel；Extrinsics 是 camera frame 相对于 robot/world frame 的刚体变换。双目需要左右各自内参及两者之间外参；VIO 需要 camera–IMU 外参。<\/p>\n<p>进一步阅读：<a href=\"?page=sensors-and-estimation\">传感器与估计<\/a>、<a href=\"?page=data-pipeline\">机器人数据 Schema<\/a>。<\/p>\n","toc":[{"level":2,"title":"坐标系和右手定则","id":"section-1"},{"level":2,"title":"URDF = 结构描述","id":"section-2"},{"level":2,"title":"TF Tree = 当前坐标变换关系","id":"section-3"},{"level":2,"title":"FK（正运动学）","id":"section-4"},{"level":2,"title":"IK（逆运动学）","id":"section-5"},{"level":2,"title":"Camera Intrinsics 与 Extrinsics","id":"section-6"}],"words":1558},{"id":"sensors-and-estimation","section":"foundations","title":"传感器、相机与状态估计","file":"sensors-and-estimation.md","summary":"Encoder、IMU、双目/鱼眼、内外参、VIO、SLAM。","tags":["Encoder","IMU","Camera","VIO","SLAM"],"related":["geometry-and-frames","data-pipeline"],"maturity":"概念速览","html":"<blockquote>\n<p><strong>Encoder 测机械轴的运动；IMU 测惯性运动；Camera 提供外部世界几何信息。<\/strong> 融合它们可以互相约束误差。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Encoder 与 IMU<\/h2>\n<p>Encoder 常测 wheel / joint 的旋转角度、速度或直线位移；增量式 encoder 通常需要 homing，绝对式 encoder 可以提供绝对位置读数。Wheel encoder 用轮子转角估计里程，遇到 slip 时会偏离真实运动。<\/p>\n<p>IMU（Inertial Measurement Unit）主要包含 <strong>3-axis accelerometer + 3-axis gyroscope<\/strong>：测 specific force 和 angular velocity。它能提供高频运动信息，但积分后会累计 bias/drift。静止平放时加速度计可能读到约 <code>±9.81 m/s²<\/code>，是测量比力/支撑效应，不代表设备正在以该数值向上运动。<\/p>\n<table>\n<thead>\n<tr>\n  <th>项目<\/th>\n  <th>Encoder<\/th>\n  <th>IMU<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>直接测量<\/td>\n  <td>轴/关节位置与运动<\/td>\n  <td>比力、角速度<\/td>\n<\/tr>\n<tr>\n  <td>常安装在<\/td>\n  <td>轮子、电机、关节<\/td>\n  <td>机器人机体/链接<\/td>\n<\/tr>\n<tr>\n  <td>典型误差<\/td>\n  <td>打滑、传动误差、量化误差<\/td>\n  <td>Bias、噪声、积分漂移<\/td>\n<\/tr>\n<tr>\n  <td>用途<\/td>\n  <td>Odometry、Joint State<\/td>\n  <td>姿态估计、短期运动传播<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-2\">Stereo 与 Fisheye 是不同维度<\/h2>\n<ul>\n<li><strong>Stereo<\/strong>：两个已知相对位姿且有视野重叠的相机形成双目，利用 disparity / triangulation 估计深度。<\/li>\n<li><strong>Fisheye<\/strong>：超广角镜头与其成像模型，通常提供更大 FOV，也带来显著畸变。<\/li>\n<li><strong>RGB<\/strong>：颜色通道类型，可以与前两者组合。<\/li>\n<\/ul>\n<p>例如 <code>Stereo RGB Fisheye<\/code> 完全合理。经典双目针孔近似：<\/p>\n<pre><code class=\"language-text\">Depth Z ≈ focal_length f × baseline B / disparity d\n<\/code><\/pre>\n<h2 id=\"section-3\">相机内参和外参<\/h2>\n<p>内参可写为 <code>K = [[fx,0,cx],[0,fy,cy],[0,0,1]]<\/code>，给定 3D camera point <code>(X,Y,Z)<\/code>，针孔模型投影为：<\/p>\n<pre><code class=\"language-text\">u = fx · X/Z + cx\nv = fy · Y/Z + cy\n<\/code><\/pre>\n<p>真实镜头还要建模径向/切向畸变或 fisheye projection。外参则是 frame 之间的旋转 + 平移，可以用 4×4 homogeneous transform 表示。<\/p>\n<h2 id=\"section-4\">VIO（Visual-Inertial Odometry）<\/h2>\n<p>结合 Camera 的视觉 feature / reprojection constraints 和 IMU 的高频加速度、角速度，估计连续 6-DoF pose、速度以及 IMU bias。<\/p>\n<pre><code class=\"language-text\">IMU (100–400Hz) ──&gt; Propagation / Preintegration ──┐\n                                                  ├─&gt; Filter / Optimization → Pose\nCamera (e.g.30Hz) ──&gt; Feature Tracking / Reprojection ┘\n<\/code><\/pre>\n<p>IMU 在两帧 Camera 之间做高频预测，Camera 通过可观测几何来约束漂移。典型方法有 EKF/MSCKF、滑动窗口优化、factor graph。<\/p>\n<h2 id=\"section-5\">SLAM 与 VIO<\/h2>\n<p><strong>VIO<\/strong> 主要估计相对运动轨迹，通常会 drift；<strong>SLAM<\/strong> 同时定位和建立地图，可能通过 loop closure 与全局优化改善长期一致性（但不是所有 SLAM 实现都必然具备回环检测）。<\/p>\n<pre><code class=\"language-text\">Sensors → VIO/Odometry → Local Motion Estimate\n                          ↓\n                SLAM / Map / Loop Closure\n                          ↓\n                   Map / Localization\n<\/code><\/pre>\n<p>这些状态估计结果会进一步影响 <a href=\"?page=geometry-and-frames\">TF Tree<\/a> 和 <a href=\"?page=data-pipeline\">机器人数据采集<\/a>。<\/p>\n","toc":[{"level":2,"title":"Encoder 与 IMU","id":"section-1"},{"level":2,"title":"Stereo 与 Fisheye 是不同维度","id":"section-2"},{"level":2,"title":"相机内参和外参","id":"section-3"},{"level":2,"title":"VIO（Visual-Inertial Odometry）","id":"section-4"},{"level":2,"title":"SLAM 与 VIO","id":"section-5"}],"words":1371},{"id":"file-formats","section":"foundations","title":"数据格式与软件接口","file":"file-formats.md","summary":"SDK、MCAP、XML、YUV420P、UUID、SHA-256 与常见文件格式。","tags":["SDK","MCAP","YUV420P","XML"],"related":["data-pipeline","glossary"],"maturity":"概念速览","html":"<blockquote>\n<p>机器人系统的数据格式、文件容器和软件接口属于不同层面。数据工程需要同时理解它们。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">SDK / API / ROS<\/h2>\n<ul>\n<li><strong>API<\/strong>：某项能力的调用接口，如 <code>getJointState()<\/code>。<\/li>\n<li><strong>Library<\/strong>：提供功能实现的代码库。<\/li>\n<li><strong>SDK<\/strong>：包括 API、library、文档、示例和工具的开发工具包。<\/li>\n<li><strong>ROS Topic / Service / Action<\/strong>：机器人软件之间通信与交互的机制。<\/li>\n<\/ul>\n<p>“通过 SDK 接入机器人软件”通常是指通过厂商开放的接口读取状态、获取图像或执行动作，而不是直接改写电机固件。<\/p>\n<h2 id=\"section-2\">MCAP / rosbag<\/h2>\n<p><strong>MCAP<\/strong> 是多模态、带时间戳消息的日志文件格式，可记录 ROS topics、schemas、channels 和 metadata。<strong>rosbag2<\/strong> 则是录制/回放的框架，可以使用 MCAP 作为存储后端。<\/p>\n<pre><code class=\"language-text\">Robot Topics → rosbag2 → .mcap\n                         ↓\n             Decode / Sync / Process\n                         ↓\n                Training Dataset\n<\/code><\/pre>\n<p>一个 <code>.mcap<\/code> 内可以既有 raw image、IMU，也有 processed detection、VIO pose，所以 MCAP 本身不能说明数据是否经过处理。<\/p>\n<h2 id=\"section-3\">YUV420P<\/h2>\n<p><code>YUV<\/code> 分离亮度（Y）和色度（U/V），<code>4:2:0<\/code> 表示每个 2×2 像素块共享一个 U 与一个 V，<code>P<\/code> 表示 planar：Y、U、V 分平面存储。<\/p>\n<p>对于 8-bit YUV420P，平均约 1.5 bytes/pixel，而 RGB24 是 3 bytes/pixel。该格式常见于视频编码和 Camera pipeline；训练视觉模型前可能需要转成 RGB tensor。<\/p>\n<h2 id=\"section-4\">XML / URDF<\/h2>\n<p>XML 是用层级标签组织结构化信息的语言；URDF 是定义机器人 link/joint 语义的一套 XML 规范。<\/p>\n<pre><code class=\"language-xml\">&lt;robot name=&quot;demo&quot;&gt;\n  &lt;link name=&quot;base_link&quot;/&gt;\n&lt;/robot&gt;\n<\/code><\/pre>\n<h2 id=\"section-5\">UUID / SHA-256<\/h2>\n<ul>\n<li><strong>UUID<\/strong>：128-bit 对象标识符，常用于 session、episode、robot ID；UUID v4 主要基于随机数。<\/li>\n<li><strong>SHA-256<\/strong>：将任意长度数据映射为 256-bit 的 cryptographic digest，常用于数据/文件完整性校验。它不是可逆加密，也不保证数学上的绝对唯一。<\/li>\n<\/ul>\n<h2 id=\"section-6\">其他常见词<\/h2>\n<p><strong>QA<\/strong> 是 Quality Assurance（质量保证）；<strong>DFM<\/strong> 是 Design for Manufacturing（面向制造设计）；<strong>ADAS<\/strong> 是 Advanced Driver Assistance Systems（高级驾驶辅助系统）。<\/p>\n<p>更多：<a href=\"?page=glossary\">术语速查<\/a>。<\/p>\n","toc":[{"level":2,"title":"SDK / API / ROS","id":"section-1"},{"level":2,"title":"MCAP / rosbag","id":"section-2"},{"level":2,"title":"YUV420P","id":"section-3"},{"level":2,"title":"XML / URDF","id":"section-4"},{"level":2,"title":"UUID / SHA-256","id":"section-5"},{"level":2,"title":"其他常见词","id":"section-6"}],"words":1063},{"id":"glossary","section":"reference","title":"术语速查","file":"glossary.md","summary":"跨章节检索的中英文术语词典。","tags":["Glossary","Vocabulary"],"related":["overview","file-formats"],"maturity":"持续补充","html":"<blockquote>\n<p>可用网页左上角搜索直接查找术语；这里保留跨主题的中英对照与最短定义。完整解释通过链接跳转。<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n  <th>Term<\/th>\n  <th>中文<\/th>\n  <th>直觉 / 对应专题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Embodied AI<\/td>\n  <td>具身智能<\/td>\n  <td>智能通过身体在环境中感知和行动；<a href=\"?page=overview\">总览<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Multimodal Data<\/td>\n  <td>多模态数据<\/td>\n  <td>视频、IMU、关节、语言等；<a href=\"?page=data-taxonomy\">数据<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Real-World Data<\/td>\n  <td>真实世界数据<\/td>\n  <td>在真实环境产生<\/td>\n<\/tr>\n<tr>\n  <td>Teleoperation<\/td>\n  <td>遥操作<\/td>\n  <td>人类远程控制机器人完成任务<\/td>\n<\/tr>\n<tr>\n  <td>Rollout<\/td>\n  <td>策略运行轨迹<\/td>\n  <td>策略执行产生的状态、动作与结果序列<\/td>\n<\/tr>\n<tr>\n  <td>UMI<\/td>\n  <td>通用操作接口<\/td>\n  <td>带相机的手持工具采集操作示范<\/td>\n<\/tr>\n<tr>\n  <td>Episode<\/td>\n  <td>单次交互/任务轨迹<\/td>\n  <td>通常按一次任务组织多模态数据<\/td>\n<\/tr>\n<tr>\n  <td>Data Recipe<\/td>\n  <td>训练数据配方<\/td>\n  <td>来源、处理、采样、阶段、学习目标；<a href=\"?page=data-recipe\">专题<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Data Flywheel<\/td>\n  <td>数据飞轮<\/td>\n  <td>部署数据持续改善模型的闭环；<a href=\"?page=data-flywheel\">专题<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Observation<\/td>\n  <td>观测<\/td>\n  <td>相机、状态及历史信息等模型输入<\/td>\n<\/tr>\n<tr>\n  <td>Action<\/td>\n  <td>动作<\/td>\n  <td>策略输出的关节、末端或夹爪命令<\/td>\n<\/tr>\n<tr>\n  <td>Action Chunk<\/td>\n  <td>动作块<\/td>\n  <td>一次预测多个未来 action；<a href=\"?page=training-loop\">解释<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Policy<\/td>\n  <td>策略<\/td>\n  <td>观测/目标到动作的映射<\/td>\n<\/tr>\n<tr>\n  <td>BC<\/td>\n  <td>行为克隆<\/td>\n  <td>监督模仿专家动作<\/td>\n<\/tr>\n<tr>\n  <td>IL<\/td>\n  <td>模仿学习<\/td>\n  <td>从专家行为学习；<a href=\"?page=learning-paradigms\">专题<\/a><\/td>\n<\/tr>\n<tr>\n  <td>RL<\/td>\n  <td>强化学习<\/td>\n  <td>从交互反馈优化策略<\/td>\n<\/tr>\n<tr>\n  <td>VLM<\/td>\n  <td>视觉语言模型<\/td>\n  <td>结合视觉与文本理解<\/td>\n<\/tr>\n<tr>\n  <td>VLA<\/td>\n  <td>视觉语言动作模型<\/td>\n  <td>视觉/语言/状态 → 机器人动作<\/td>\n<\/tr>\n<tr>\n  <td>World Model<\/td>\n  <td>世界模型<\/td>\n  <td>预测状态、观测或未来环境变化<\/td>\n<\/tr>\n<tr>\n  <td>IDM<\/td>\n  <td>逆动力学模型<\/td>\n  <td>前后状态 → 可能的动作<\/td>\n<\/tr>\n<tr>\n  <td>WAM<\/td>\n  <td>世界动作模型<\/td>\n  <td>联合学习世界变化与行动<\/td>\n<\/tr>\n<tr>\n  <td>Diffusion Policy<\/td>\n  <td>扩散策略<\/td>\n  <td>以扩散过程生成连续动作<\/td>\n<\/tr>\n<tr>\n  <td>Flow Matching<\/td>\n  <td>流匹配<\/td>\n  <td>学习分布之间的连续变换<\/td>\n<\/tr>\n<tr>\n  <td>Camera Intrinsics<\/td>\n  <td>相机内参<\/td>\n  <td>焦距、主点、畸变等<\/td>\n<\/tr>\n<tr>\n  <td>Camera Extrinsics<\/td>\n  <td>相机外参<\/td>\n  <td>相机和其他 frame 的空间关系<\/td>\n<\/tr>\n<tr>\n  <td>Stereo Camera<\/td>\n  <td>双目相机<\/td>\n  <td>两视角三角测量深度<\/td>\n<\/tr>\n<tr>\n  <td>Fisheye Camera<\/td>\n  <td>鱼眼相机<\/td>\n  <td>大 FOV / 特殊投影<\/td>\n<\/tr>\n<tr>\n  <td>IMU<\/td>\n  <td>惯性测量单元<\/td>\n  <td>比力、角速度；<a href=\"?page=sensors-and-estimation\">传感器<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Encoder<\/td>\n  <td>编码器<\/td>\n  <td>轴角度、旋转位移或速度<\/td>\n<\/tr>\n<tr>\n  <td>VIO<\/td>\n  <td>视觉惯性里程计<\/td>\n  <td>Camera + IMU 估计运动<\/td>\n<\/tr>\n<tr>\n  <td>SLAM<\/td>\n  <td>同步定位与建图<\/td>\n  <td>估计姿态并建立地图<\/td>\n<\/tr>\n<tr>\n  <td>6DoF Pose<\/td>\n  <td>六自由度位姿<\/td>\n  <td>3D 平移 + 3D 朝向<\/td>\n<\/tr>\n<tr>\n  <td>TF Tree<\/td>\n  <td>坐标变换树<\/td>\n  <td>运行时 frame 的父子变换关系<\/td>\n<\/tr>\n<tr>\n  <td>URDF<\/td>\n  <td>机器人描述格式<\/td>\n  <td>基于 XML 的 links/joints 描述<\/td>\n<\/tr>\n<tr>\n  <td>FK / IK<\/td>\n  <td>正/逆运动学<\/td>\n  <td>Joint → EE pose / EE target → Joint<\/td>\n<\/tr>\n<tr>\n  <td>SDK<\/td>\n  <td>软件开发工具包<\/td>\n  <td>API、库、文档和工具<\/td>\n<\/tr>\n<tr>\n  <td>MCAP<\/td>\n  <td>多模态日志容器格式<\/td>\n  <td>时间序列消息记录<\/td>\n<\/tr>\n<tr>\n  <td>Parquet<\/td>\n  <td>列式数据格式<\/td>\n  <td>常存 robot state/action 序列<\/td>\n<\/tr>\n<tr>\n  <td>HDF5<\/td>\n  <td>分层数据文件<\/td>\n  <td>存数组与多模态数据<\/td>\n<\/tr>\n<tr>\n  <td>UUID<\/td>\n  <td>通用唯一标识符<\/td>\n  <td>标识 session/episode/object<\/td>\n<\/tr>\n<tr>\n  <td>SHA-256<\/td>\n  <td>哈希算法<\/td>\n  <td>文件内容摘要和完整性校验<\/td>\n<\/tr>\n<tr>\n  <td>YUV420P<\/td>\n  <td>视频像素格式<\/td>\n  <td>亮度全分辨率、色度下采样、planar<\/td>\n<\/tr>\n<tr>\n  <td>MPJPE<\/td>\n  <td>平均关节位置误差<\/td>\n  <td>3D pose 估计关节欧氏误差均值<\/td>\n<\/tr>\n<tr>\n  <td>QA<\/td>\n  <td>质量保证<\/td>\n  <td>流程、验证与发布质量<\/td>\n<\/tr>\n<tr>\n  <td>DFM<\/td>\n  <td>可制造性设计<\/td>\n  <td>设计阶段考虑制造成本、良率<\/td>\n<\/tr>\n<tr>\n  <td>ADAS<\/td>\n  <td>高级驾驶辅助<\/td>\n  <td>车辆感知与驾驶辅助控制<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这份 glossary 是<strong>索引<\/strong>而不是最终完整定义。随着专题深入，每个重要术语都可以发展为独立文章。<\/p>\n","toc":[],"words":1280},{"id":"reading-list","section":"reference","title":"论文与官方资料索引","file":"reading-list.md","summary":"以原始论文和技术报告为优先，保留研究出处。","tags":["Papers","References","Sources"],"related":["industry-landscape","data-recipe"],"maturity":"持续补充","html":"<blockquote>\n<p>优先保留官方技术报告、研究团队项目页和论文原文。行业数字随时间变化，每个数字都应该对应具体模型版本和来源日期。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">Industry / Data Recipe<\/h2>\n<table>\n<thead>\n<tr>\n  <th>研究对象<\/th>\n  <th>一手来源<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>NVIDIA GR00T 2<\/td>\n  <td><a href=\"https://research.nvidia.com/labs/gear/gr00t-2/\">NVIDIA GEAR 官方研究<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Physical Intelligence π0<\/td>\n  <td><a href=\"https://www.physicalintelligence.company/download/pi0.pdf\">原始论文 PDF<\/a> / <a href=\"https://www.physicalintelligence.company/blog/pi0\">研究文章<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Figure Index<\/td>\n  <td><a href=\"https://www.figure.ai/news/introducing-index\">Figure 官方公告<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Figure Helix 2.5<\/td>\n  <td><a href=\"https://www.figure.ai/news/helix-2-5-zero-shot-30-home-generalization\">30-Home Generalization<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Figure Helix 02<\/td>\n  <td><a href=\"https://www.figure.ai/news/helix-02\">Full-Body Autonomy<\/a><\/td>\n<\/tr>\n<tr>\n  <td>1X World Model<\/td>\n  <td><a href=\"https://www.1x.tech/discover/world-model-self-learning\">1X 官方文章<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Google Gemini Robotics 2.5<\/td>\n  <td><a href=\"https://deepmind.google/blog/gemini-robotics-2-5-accelerates-real-world-physical-intelligence/\">DeepMind 官方文章<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Open X-Embodiment<\/td>\n  <td><a href=\"https://deepmind.google/blog/scaling-up-learning-across-many-different-robot-types/\">DeepMind 官方研究简介<\/a><\/td>\n<\/tr>\n<tr>\n  <td>TRI LBM<\/td>\n  <td><a href=\"https://toyotaresearchinstitute.github.io/lbm1/\">Toyota Research Institute 项目页<\/a><\/td>\n<\/tr>\n<tr>\n  <td>AgiBot GE-Act 2.0<\/td>\n  <td><a href=\"https://www.agibot.com/news/newsroom/agibot-releases-ge-act-2-0-providing-the-120\">官方公告<\/a> / <a href=\"https://declare-lab.github.io/projects/ge-act-2/\">研究项目<\/a><\/td>\n<\/tr>\n<tr>\n  <td>Skild AI S1<\/td>\n  <td><a href=\"https://www.skild.ai/blogs/s1\">Skild 官方研究文章<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"section-2\">Dataset Engineering<\/h2>\n<ul>\n<li><a href=\"https://huggingface.co/docs/lerobot/lerobot-dataset-v3\">Hugging Face LeRobotDataset v3.0 官方文档<\/a><\/li>\n<li><a href=\"https://docs.foxglove.dev/docs/sdk/concepts\">Foxglove MCAP SDK / Concept Docs<\/a><\/li>\n<\/ul>\n<h2 id=\"section-3\">以后读论文时可以保持的记录方式<\/h2>\n<pre><code class=\"language-text\">Title / Model Version:\nDate / Primary Source:\nQuestion / Hypothesis:\nTraining Dataset:\nData Processing / Mixture:\nTraining Objectives:\nHardware / Action Representation:\nEvaluation &amp; Baselines:\nReported Evidence:\nUnknowns / Limitations:\nMy Understanding / Open Questions:\n<\/code><\/pre>\n<p>这是供知识整理使用的<strong>可选模板<\/strong>，不是学习进度表、考试或固定训练计划。若公司没有公开关键细节，请明确标注 <code>not disclosed<\/code>，不要补猜测数字。<\/p>\n","toc":[{"level":2,"title":"Industry / Data Recipe","id":"section-1"},{"level":2,"title":"Dataset Engineering","id":"section-2"},{"level":2,"title":"以后读论文时可以保持的记录方式","id":"section-3"}],"words":790},{"id":"maintain","section":"reference","title":"如何扩展这个知识库","file":"maintain.md","summary":"Markdown 编辑、新增章节、来源记录与构建流程。","tags":["Knowledge Base","Markdown","Maintenance"],"related":["overview","reading-list"],"maturity":"使用说明","html":"<blockquote>\n<p>这个网站采取 <strong>content-as-code<\/strong>：网页只是展示层，知识本体保存在独立 Markdown 文件中。<\/p>\n<\/blockquote>\n<h2 id=\"section-1\">目录结构<\/h2>\n<pre><code class=\"language-text\">embodied-ai-atlas/\n├── content/\n│   ├── manifest.json        # 章节、导航、标签、关联\n│   ├── overview.md           # 一个章节一份 Markdown\n│   ├── data-taxonomy.md\n│   ├── company-nvidia.md\n│   └── ...\n├── assets/\n│   ├── site.css              # 全站视觉风格\n│   └── site.js               # 搜索、导航、交互\n├── build.py                  # 静态网站生成\n├── requirements.txt\n├── README.md\n└── dist/\n    └── index.html           # 单文件网页，可以直接打开\n<\/code><\/pre>\n<h2 id=\"section-2\">修改已有文章<\/h2>\n<p>只需编辑对应 <code>content/*.md<\/code>。例如要增加 VIO 数学推导，就改 <code>sensors-and-estimation.md<\/code>，或者将 VIO 拆成新的专题文章。<\/p>\n<h2 id=\"section-3\">新增一个独立章节<\/h2>\n<ol>\n<li>在 <code>content/<\/code> 下新增例如 <code>vio-deep-dive.md<\/code>。<\/li>\n<li>在 <code>content/manifest.json<\/code> 的 <code>pages<\/code> 增加一条记录：id、section、title、file、summary、tags 等。<\/li>\n<li>在相关文章添加指向新页面 ID 的内部链接（例如新增 <code>vio-deep-dive<\/code> 页面后，再建立引用）。<\/li>\n<li>运行 <code>python build.py<\/code>，生成更新后的 <code>dist/index.html<\/code>。<\/li>\n<\/ol>\n<h2 id=\"section-4\">本地运行<\/h2>\n<pre><code class=\"language-bash\">pip install -r requirements.txt\npython build.py\n<\/code><\/pre>\n<p>然后直接双击 <code>dist/index.html<\/code>，无需后端和本地服务器；中文搜索、章节切换、主题切换都可离线使用。引用的外部研究链接需联网访问。<\/p>\n<h2 id=\"section-5\">迭代原则<\/h2>\n<ul>\n<li>一页尽量只覆盖一个连贯的知识单元；通过 Related Topics 链接跨页面连接。<\/li>\n<li>公司数据保留 <strong>报告日期、模型版本、原始来源、已知与未知<\/strong>，不要悄悄把推测改成事实。<\/li>\n<li>对术语先给一句话解释，逐步补充机制、数学、实现、trade-offs、研究前沿。<\/li>\n<li>优先把新材料写到相应 Markdown；当主题自然长大后再拆成独立页面。<\/li>\n<li>不强制学习顺序，也不设成绩/打卡/课程进度。<\/li>\n<\/ul>\n<h2 id=\"section-6\">重要提醒<\/h2>\n<p>这个离线站点支持<strong>浏览、搜索、阅读和源文件编辑<\/strong>，但网页本身不是在线协作文档编辑器。修改 Markdown 后需要重新运行一次构建命令。后续如要多人协作、版本历史和一键发布，可以将整个源码目录放进 Git 仓库，使用 GitHub Pages / Cloudflare Pages 等静态托管服务。<\/p>\n","toc":[{"level":2,"title":"目录结构","id":"section-1"},{"level":2,"title":"修改已有文章","id":"section-2"},{"level":2,"title":"新增一个独立章节","id":"section-3"},{"level":2,"title":"本地运行","id":"section-4"},{"level":2,"title":"迭代原则","id":"section-5"},{"level":2,"title":"重要提醒","id":"section-6"}],"words":1037}]}</script>
